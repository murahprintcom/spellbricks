<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Spellbricks Stats</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #18221a; --panel: #223026; --panel2: #2b3c2f; --ink: #241826; --edge: #3b5240;
    --text: #f4ecd8; --dim: #a9b59a; --gold: #ffd35c; --win: #7ee06a; --lose: #ff7a6a; --bar: #ffd35c; --track: #314536;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Pixelify Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.4; }
  body { padding: 20px 16px 48px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1, h2, .num, .pix { font-family: 'Press Start 2P', monospace; font-weight: 400; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  h1 { font-size: 20px; color: var(--gold); margin: 0; text-shadow: 3px 3px 0 var(--ink); letter-spacing: 1px; }
  h1 small { display: block; font-size: 10px; color: var(--dim); text-shadow: none; margin-top: 8px; letter-spacing: 0; }
  h2 { font-size: 12px; color: var(--gold); margin: 0 0 12px; }
  .meta { color: var(--dim); font-size: 14px; text-align: right; }
  .meta a { color: var(--gold); }
  .panel { background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); border-radius: 6px; padding: 14px; min-width: 0; }
  .grid { display: grid; gap: 14px; }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 14px; }
  .two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); margin-top: 14px; }
  .tile .lbl { color: var(--dim); font-size: 14px; }
  .tile .num { font-size: 20px; margin: 8px 0 4px; color: var(--text); }
  .tile .sub { color: var(--dim); font-size: 13px; }
  .tile.hl .num { color: var(--gold); }
  /* daily chart */
  .chart { position: relative; height: 180px; display: grid; grid-template-columns: repeat(30, 1fr); gap: 2px; align-items: end; border-bottom: 2px solid var(--edge); padding-top: 8px; }
  .col { position: relative; height: 100%; display: flex; align-items: end; cursor: default; }
  .col i { display: block; width: 100%; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 0; }
  .col:hover i, .col:focus i { background: #fff1b0; }
  .col:focus { outline: none; }
  .axis { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; margin-top: 6px; }
  .ymax { position: absolute; left: 0; top: -2px; color: var(--dim); font-size: 12px; }
  .tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--text); border: 2px solid var(--gold); border-radius: 4px; padding: 8px 10px; font-size: 14px; z-index: 10; display: none; white-space: nowrap; }
  .tip b { color: var(--gold); }
  /* bar lists */
  .bars { display: grid; gap: 8px; }
  .brow { display: grid; grid-template-columns: 112px 1fr 70px; gap: 8px; align-items: center; font-size: 15px; }
  .brow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brow .nm .dot { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--ink); border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .brow .trk { background: var(--track); height: 14px; border-radius: 0 4px 4px 0; overflow: hidden; }
  .brow .trk i { display: block; height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; }
  .brow .v { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  .brow .v small { color: var(--dim); }
  /* tables */
  .tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
  .tbl th { text-align: left; color: var(--dim); font-weight: 400; padding: 6px 6px; border-bottom: 2px solid var(--edge); white-space: nowrap; }
  .tbl td { padding: 7px 6px; border-bottom: 1px solid var(--track); white-space: nowrap; }
  .tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .tbl tr:hover td { background: var(--panel2); }
  .scroll { overflow-x: auto; }
  .rank { font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--gold); }
  .win { color: var(--win); } .lose { color: var(--lose); } .dim { color: var(--dim); }
  .empty { color: var(--dim); font-size: 15px; padding: 10px 0; }
  .note { color: var(--dim); font-size: 13px; margin-top: 18px; text-align: center; }
  .err { background: #3a1f22; border-color: var(--ink); color: var(--text); }
  @media (max-width: 520px) { h1 { font-size: 15px; } .tile .num { font-size: 16px; } .brow { grid-template-columns: 92px 1fr 62px; font-size: 14px; } .meta { text-align: left; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SPELLBRICKS STATS<small>Live numbers from every player (anonymous)</small></h1>
    <div class="meta"><span id="updated">Loading…</span><br><a href="/">Play Spellbricks →</a></div>
  </header>
  <div id="app"></div>
  <p class="note">Players are counted by a random id stored in their browser, so the same person on two devices counts twice. Days use Malaysia time. The page refreshes every minute.</p>
</div>
<div class="tip" id="tip"></div>
<script>
(function () {
  'use strict';
  const HEROES = { ignis: ['Ignis', '#ff8a5a'], marisa: ['Marisa', '#6fb0ff'], raiden: ['Raiden', '#ffe14a'], sylva: ['Sylva', '#8be05a'], brick: ['Brick', '#d0c8b4'] };
  const DIFF = ['Easy', 'Normal', 'Hard'];
  const AI = ['Easy AI', 'Normal AI', 'Hard AI'];
  const DUNGEONS = ['Mossy Ruins', 'Storm Peaks', 'Prism Spire', 'Sunken Abyss', 'Eclipse Citadel'];
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const n = (v) => Number(v || 0).toLocaleString('en-US');
  const pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '–');
  const nice = (id) => (id ? String(id).replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase()) : 'Unknown');
  const hero = (id) => (HEROES[id] ? HEROES[id][0] : nice(id));
  const heroDot = (id) => `<span class="dot" style="background:${HEROES[id] ? HEROES[id][1] : '#8a8f9e'}"></span>`;
  const dur = (s) => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`; };
  const ago = (ts) => { const d = (Date.now() - ts) / 1000; return d < 3600 ? Math.max(1, Math.round(d / 60)) + 'm ago' : d < 86400 ? Math.round(d / 3600) + 'h ago' : Math.round(d / 86400) + 'd ago'; };
  const flag = (cc) => (cc && /^[A-Z]{2}$/.test(cc) ? String.fromCodePoint(...[...cc].map((c) => 0x1f1a5 + c.charCodeAt(0))) + ' ' + cc : 'Unknown');
  const player = (pid) => 'Player #' + esc(pid || '??????');

  const tile = (lbl, num, sub, hl) => `<div class="panel tile ${hl ? 'hl' : ''}"><div class="lbl">${lbl}</div><div class="num">${num}</div><div class="sub">${sub || '&nbsp;'}</div></div>`;
  const panel = (title, body) => `<section class="panel"><h2>${title}</h2>${body}</section>`;
  const empty = (msg) => `<div class="empty">${msg || 'No data yet. Numbers appear once people play.'}</div>`;
  const bars = (rows) => {
    if (!rows.length) return empty();
    const max = Math.max(1, ...rows.map((r) => r.value));
    return `<div class="bars">${rows.map((r) => `<div class="brow" title="${esc(r.title || '')}"><span class="nm">${r.label}</span><span class="trk"><i style="width:${(r.value / max) * 100}%"></i></span><span class="v">${n(r.value)}${r.extra ? ` <small>${r.extra}</small>` : ''}</span></div>`).join('')}</div>`;
  };

  function daily(days) {
    const max = Math.max(1, ...days.map((d) => d.players));
    const fmt = (iso) => new Date(iso + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
    return `<div class="chart" id="daily"><span class="ymax">${n(max)}</span>${days.map((d, i) => `<div class="col" tabindex="0" data-i="${i}" aria-label="${fmt(d.date)}: ${d.players} players"><i style="height:${(d.players / max) * 100}%"></i></div>`).join('')}</div>
      <div class="axis"><span>${fmt(days[0].date)}</span><span>${fmt(days[15].date)}</span><span>Today</span></div>`;
  }

  function render(s) {
    const t = s.totals || {};
    const app = document.getElementById('app');
    const days = s.daily || [];
    const winRate = pct(t.battlesWon, t.battles);
    let html = `<div class="grid tiles">
      ${tile('Total players', n(t.players), `+${n(t.newToday)} new today · +${n(t.new7)} this week`, true)}
      ${tile('Playing today', n(t.activeToday), `${n(t.active7)} this week · ${n(t.active30)} this month`)}
      ${tile('Runs started', n(t.runsStarted), `${n(t.runsWon)} finished all 5 dungeons`)}
      ${tile('Bosses beaten', n(t.bossesBeaten), `${n(t.battles)} battles · ${winRate} won`)}
      ${tile('Lines cleared', n(t.lines), `${n(t.sessions)} game sessions`)}
      ${tile('Time in battle', dur(t.playSeconds), 'all players together')}
    </div>`;
    html += panel('Players per day (last 30 days)', days.length ? daily(days) : empty());

    // records
    const R = s.records || {};
    const rec = (lbl, r, fmt) => tile(lbl, r ? fmt(r.v) : '–', r ? `${player(r.pid)}${r.hero ? ' · ' + esc(hero(r.hero)) : ''}${r.enemy ? ' vs ' + esc(nice(r.enemy)) : ''}` : 'not set yet', !!r);
    html += `<h2 style="margin:22px 0 12px">RECORDS</h2><div class="grid tiles">
      ${rec('High score (run)', R.bestScore, n)}
      ${rec('Best combo', R.bestCombo, (v) => v + 'x')}
      ${rec('Fastest boss kill', R.fastestBoss, dur)}
      ${rec('Most lines, 1 battle', R.mostLines, n)}
      ${rec('Best speed', R.bestPPM, (v) => v + ' ppm')}
    </div>`;

    // leaderboard
    const top = s.topRuns || [];
    html += panel('Top 10 runs (high score)', top.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Player</th><th>Hero</th><th>Difficulty</th><th>Reached</th><th class="n">Score</th><th>When</th></tr></thead><tbody>
      ${top.map((r, i) => `<tr><td class="rank">${i + 1}</td><td>${player(r.pid)} <span class="dim">${r.country ? esc(flag(r.country)) : ''}</span></td><td>${heroDot(r.hero)}${esc(hero(r.hero))}</td><td>${esc(DIFF[r.diff] || '–')}</td>
        <td>${r.win ? '<span class="win">Cleared all!</span>' : `D${r.dungeon} · ${esc(DUNGEONS[r.dungeon - 1] || '')}`}</td><td class="n"><b>${n(r.score)}</b></td><td class="dim">${ago(r.ts)}</td></tr>`).join('')}
    </tbody></table></div><p class="dim" style="font-size:13px;margin:10px 0 0">Score = floors cleared × 100 + lines + attack sent, × difficulty (Easy 1, Normal 1.5, Hard 2), +2000 for clearing all 5 dungeons.</p>` : empty('No finished runs yet.'));

    // bosses + progress
    const bosses = s.bosses || [];
    const reached = s.reached || [];
    const endedRuns = reached.reduce((a, r) => a + r.runs, 0);
    html += `<div class="grid two">
      ${panel('Bosses', bosses.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>Boss</th><th class="n">Fights</th><th class="n">Beaten</th><th class="n">Win rate</th><th class="n">Fastest</th></tr></thead><tbody>
        ${bosses.map((b) => `<tr><td>${esc(nice(b.enemy))}<br><span class="dim" style="font-size:13px">Dungeon ${b.dungeon || '?'}</span></td><td class="n">${n(b.fights)}</td><td class="n">${n(b.wins)}</td><td class="n">${pct(b.wins, b.fights)}</td><td class="n">${b.fastest ? dur(b.fastest) : '–'}</td></tr>`).join('')}
      </tbody></table></div>` : empty('Nobody has reached a boss yet.'))}
      ${panel('Where runs end', bars(reached.map((r) => ({ label: `D${r.dungeon} ${esc(DUNGEONS[r.dungeon - 1] || '')}`, value: r.runs, extra: pct(r.runs, endedRuns), title: `${r.runs} runs ended in dungeon ${r.dungeon}${r.wins ? `, ${r.wins} of them cleared everything` : ''}` }))))}
    </div>`;

    // heroes + deadliest
    const heroes = s.heroes || [];
    html += `<div class="grid two">
      ${panel('Hero picks', bars(heroes.map((h) => ({ label: heroDot(h.hero) + esc(hero(h.hero)), value: h.runs, extra: h.ended ? pct(h.wins, h.ended) + ' win' : '', title: `${h.runs} runs started, ${h.wins} won, best dungeon ${h.bestDungeon || '–'}` }))))}
      ${panel('Toughest enemies (most player losses)', bars((s.deadliest || []).map((e) => ({ label: esc(nice(e.enemy)), value: e.losses, extra: e.tier === 'boss' ? 'boss' : e.tier === 'elite' ? 'elite' : '', title: `${e.losses} losses against ${nice(e.enemy)}` }))))}
    </div>`;

    // difficulty, quick battle, countries, devices
    const diffs = s.difficulty || [], quick = s.quick || [];
    html += `<div class="grid two">
      ${panel('Run difficulty', bars(diffs.map((d) => ({ label: esc(DIFF[d.diff] || '?'), value: d.runs }))))}
      ${panel('Quick Battle', bars(quick.map((q) => ({ label: esc(AI[q.level] || '?'), value: q.battles, extra: pct(q.wins, q.battles) + ' win', title: `${q.battles} battles, ${q.wins} won` }))))}
      ${panel('Countries', bars((s.countries || []).map((c) => ({ label: esc(flag(c.country === '??' ? '' : c.country)), value: c.players }))))}
      ${panel('Devices', bars((s.devices || []).map((d) => ({ label: esc(d.device === 'touch' ? 'Phone / tablet' : d.device === 'desktop' ? 'Computer' : 'Unknown'), value: d.players }))))}
    </div>`;

    app.innerHTML = html;
    document.getElementById('updated').textContent = 'Updated ' + new Date(s.generated || Date.now()).toLocaleTimeString();
    hookTip(days);
  }

  function hookTip(days) {
    const chart = document.getElementById('daily'), tip = document.getElementById('tip');
    if (!chart) return;
    const show = (el, x, y) => {
      const d = days[+el.dataset.i];
      const date = new Date(d.date + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
      tip.innerHTML = `<b>${date}</b><br>${n(d.players)} players · ${n(d.newPlayers)} new<br>${n(d.runs)} runs · ${n(d.battles)} battles`;
      tip.style.display = 'block';
      const w = tip.offsetWidth, h = tip.offsetHeight;
      tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w / 2)) + 'px';
      tip.style.top = Math.max(8, y - h - 14) + 'px';
    };
    chart.querySelectorAll('.col').forEach((c) => {
      c.addEventListener('pointermove', (e) => show(c, e.clientX, e.clientY));
      c.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
      c.addEventListener('focus', () => { const r = c.getBoundingClientRect(); show(c, r.left + r.width / 2, r.top); });
      c.addEventListener('blur', () => { tip.style.display = 'none'; });
    });
  }

  async function load() {
    try {
      const r = await fetch('/api/stats', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      render(await r.json());
    } catch (e) {
      document.getElementById('app').innerHTML = `<div class="panel err">Could not load stats (${esc(e.message)}). Try again in a minute.</div>`;
      document.getElementById('updated').textContent = 'Offline';
    }
  }
  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
