            <div class="set-row"><span>Garbage rule</span>${seg('garbageMode', [['direct', 'Direct'], ['classic', 'Classic']], st.garbageMode || 'direct')}</div>
            <p class="tiny dim">Classic: 2/3/4 lines send 1/2/4 garbage, queued, and clearing cancels it. Direct: every cleared line sends 1 garbage row that lands at once.</p>
            <div class="set-row"><span>Match time</span>${seg('matchTime', [[1, '1m'], [2, '2m'], [3, '3m'], [4, '4m'], [5, '5m'], [0, 'No limit']], st.matchTime || 0)}</div>
            <div class="set-row"><span>Auto-repeat delay (DAS) <span class="dim tiny">${Math.round(st.das * 1000)}ms</span></span><input type="range" min="0.05" max="0.3" step="0.01" value="${st.das}" data-set="das"></div>
            <div class="set-row"><span>Repeat rate (ARR) <span class="dim tiny">${Math.round(st.arr * 1000)}ms</span></span><input type="range" min="0" max="0.1" step="0.005" value="${st.arr}" data-set="arr"></div>
          </div>
          <div class="panel">
            <h3>Controls <span class="tiny">(click a key, then press the new key)</span></h3>
            ${Object.keys(names).map((a) => `<div class="set-row"><span>${names[a]}</span><span>${st.keys[a].map((c, i) => `<span class="keycap ${waiting && waiting[0] === a && waiting[1] === i ? 'wait' : ''}" data-act="key" data-arg="${a}:${i}">${waiting && waiting[0] === a && waiting[1] === i ? '...' : esc(pretty(c))}</span>`).join('')}</span></div>`).join('')}
            <div class="row mt"><button class="btn sm" data-act="resetKeys">Reset controls</button></div>
          </div>
          <div class="panel">
            <h3>Data</h3>
            <div class="set-row"><span>Share anonymous play stats <span class="dim tiny">(no name or email; shown at /stats)</span></span><button class="btn sm" data-act="tog" data-arg="analytics">${st.analytics !== false ? 'ON' : 'OFF'}</button></div>
            <div class="set-row"><span>Delete all progress (collection, stats, run)</span><button class="btn sm" data-act="wipe">Delete</button></div>
          </div>
        </div>`, {
          back: () => { save().write(); (back || UI.title)(); },
          tog(k) { st[k] = !st[k]; save().write(); render(); },
          set(arg) {
            const [k, v] = arg.split(':');
            st[k] = k === 'cols' || k === 'matchTime' ? +v : v;
            if (k === 'controls') { st.touchHelpV2 = false; EB.Game.applyTouch(); }
            save().write(); render();
          },
          key(arg) { const [a, i] = arg.split(':'); waiting = [a, +i]; render(); },
          resetKeys() { st.keys = JSON.parse(JSON.stringify(save().DEFAULT_KEYS)); save().write(); render(); },
          wipe() {
            const b = modal.open(`<h2>Delete everything?</h2><p class="small">This removes your collection, statistics and current run.</p><div class="row center"><button class="btn" data-act="n">Cancel</button><button class="btn primary" data-act="y">Delete</button></div>`, true);
            bind(b.parentElement, { n: () => modal.close(), y: () => { modal.close(); save().resetAll(); toast('Progress deleted.'); UI.title(); } });
          },
        });
        UI.root().querySelectorAll('[data-set]').forEach((inp) => {
          inp.oninput = () => {
            const k = inp.dataset.set;
            st[k] = parseFloat(inp.value);
            if (k === 'music' || k === 'sfx') EB.Audio.setVolume(k, st[k]);
            if (k === 'sfx') EB.Audio.sfx('rotate');
          };
          inp.onchange = () => { save().write(); if (inp.dataset.set === 'das' || inp.dataset.set === 'arr') render(); };
        });
      };
      const onKey = (e) => {
        if (!waiting) return;
        if (!document.body.contains(UI.root().querySelector('.keycap.wait'))) { waiting = null; return; }
        e.preventDefault();
        const [a, i] = waiting;
        // a key can only do one thing
        for (const k in st.keys) st.keys[k] = st.keys[k].filter((c) => c !== e.code);
        st.keys[a][i] = e.code;
        st.keys[a] = st.keys[a].filter(Boolean);
        if (!st.keys[a].length) st.keys[a] = [e.code];
        waiting = null; save().write(); render();
      };
      window.removeEventListener('keydown', UI._keyHandler || (() => {}), true);
      UI._keyHandler = onKey;
      window.addEventListener('keydown', onKey, true);
      render();
    },

    // ================= HOW TO PLAY =================
    howto(back, first) {
      const k = (a) => save().settings.keys[a].map((c) => `<kbd>${esc(c.replace(/^Key|^Arrow/, ''))}</kbd>`).join(' ');
      UI.show(`<div class="wrap">
        <div class="row spread"><h2>How to Play</h2><button class="btn ${first ? 'primary' : 'sm'}" data-act="back">${first ? 'Start!' : 'Back'}</button></div>
        <div class="howto-grid">
          <div class="panel"><h3>The Arena</h3><p>Your board is at the <b style="color:var(--you)">TOP</b>: your blocks fall <b>down</b> toward the centre battle line.
            The enemy board is at the <b style="color:var(--foe)">BOTTOM</b>: its blocks rise <b>up</b> toward the centre. Both of you play at the same time.</p>
            <p>The dashed red line on the outer edge is your <b>danger line</b>. If your stack reaches it, you lose instantly.</p></div>
          <div class="panel"><h3>Controls</h3><ul>
            <li>Move: ${k('left')} ${k('right')}</li><li>Soft drop: ${k('soft')}</li><li>Hard drop: ${k('hard')}</li>
            <li>Rotate: ${k('cw')} / ${k('ccw')}</li><li>Hold card: ${k('hold')}</li><li>Hero skill: ${k('skill')} or tap your hero</li><li>Pause: ${k('pause')}</li></ul>
            <p class="dim">Phones (Tap scheme): tap a column to send the block there, tap it again to drop, tap the block to rotate, drag down to lower it slowly, flick down to hard drop, flick up to hold. Change it in Settings.</p></div>
          <div class="panel"><h3>Lines are Attacks</h3><p>Fill a row to clear it. Clears send garbage rows to your foe:</p>
            <ul><li>1 line → 0</li><li>2 lines → 1</li><li>3 lines → 2</li><li>4 lines → 4 (+1 back-to-back)</li><li>Combos (clears in a row) add more</li></ul>
            <p>Garbage enters from the centre side and pushes the stack toward the danger line. <b>Clear lines while garbage is incoming to cancel it.</b></p></div>
          <div class="panel"><h3>Speed is Skill</h3><p>Gravity is steady. You play faster by deciding faster: hard drop as soon as a piece is placed well and the next card arrives at once.
            A piece placed within ${EB.CONFIG.RAPID_TIME}s is <b>rapid</b> — Lightning cards love that. But sloppy speed builds holes, and holes lose games.</p></div>
          <div class="panel"><h3>Your Pieces are Your Deck</h3><p>Every block is a card. You draw from your deck, used cards go to the discard pile, and the discard pile is reshuffled when the deck runs out.
            You see the next 3 cards and can hold one. Cards have rarities and abilities, and can be upgraded.</p></div>
          <div class="panel"><h3>Elements</h3><ul>${EB.ELEMENT_IDS.map((e) => `<li><b style="color:${EB.ELEMENTS[e].color}">${EB.ELEMENTS[e].name}</b> (${EB.ELEMENTS[e].role}): ${esc(EB.ELEMENTS[e].blurb)} Full energy → <b>${EB.ELEMENTS[e].burst.name}</b>: ${esc(EB.ELEMENTS[e].burst.desc)}.</li>`).join('')}</ul></div>
          <div class="panel"><h3>Reactions</h3><p>Clear lines that mix two elements (blocks, your card, or your lingering aura) to trigger a reaction:</p>
            <ul>${EB.REACTIONS.map((r) => `<li><b style="color:${r.color}">${r.name}</b> (${r.els.map((e) => EB.ELEMENTS[e].name).join(' + ')}): ${esc(r.desc)}</li>`).join('')}</ul></div>
          <div class="panel"><h3>Winning</h3><ul><li>Push the foe's stack to their danger line, or</li><li>after 2:00 have the <b>lower</b> stack.</li>
            <li>Tie → fewer garbage received → more lines → sudden death (first clear wins).</li></ul></div>
          <div class="panel"><h3>The Run</h3><p>Fight through ${EB.DUNGEONS.length} dungeons (${EB.DUNGEONS.map((d) => d.name).join(', ')}). In each, pick a path up an 8-floor map: battles, elites, events, shops, forges and rest sites, then the boss. Each dungeon's foes are faster and its rewards rarer.
            After each win choose 1 of 3 rewards: new cards, upgrades, card removal, relics, gold, healing or elemental blessings.</p></div>
        </div>
      </div>`, {
        back() { if (first) { save().profile.tutorialSeen = true; save().write(); } (back || UI.title)(); },
      });
    },
  };

  // animated falling blocks behind the title
  function titleAnim() {
    const cv = document.getElementById('titleBg');
    if (!cv) return;
    const g = cv.getContext('2d');
    const kinds = ['fire', 'water', 'nature', 'lightning', 'n:I', 'n:T', 'n:O'];
    const drops = [];
    let last = performance.now();
    const step = (now) => {
      if (!document.body.contains(cv)) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (cv.width !== cv.clientWidth || cv.height !== cv.clientHeight) { cv.width = cv.clientWidth; cv.height = cv.clientHeight; }
      g.clearRect(0, 0, cv.width, cv.height);
      if (drops.length < 26 && Math.random() < 0.08) {
        const up = Math.random() < 0.5;
        drops.push({ x: Math.floor(Math.random() * (cv.width / 24)) * 24, y: up ? cv.height + 24 : -24, v: (up ? -1 : 1) * (30 + Math.random() * 60), k: kinds[Math.floor(Math.random() * kinds.length)] });
      }
      g.imageSmoothingEnabled = false;
      for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i];
        d.y += d.v * dt;
        g.drawImage(EB.Pix.tile(d.k, 24), d.x, Math.round(d.y / 24) * 24);
        if (d.y < -40 || d.y > cv.height + 40) drops.splice(i, 1);
      }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  EB.UI = UI;
})(globalThis.EB = globalThis.EB || {});

</script>
  <script>/* js/main.js */
// Game controller: boots the app, owns the battle loop, pause menu and audio hooks.
(function (EB) {
  'use strict';
  const { modal, bind } = EB.UIC;

  const Game = {
    battle: null, renderer: null, input: null, raf: 0, paused: false, onEnd: null, cfg: null,
    heartbeat: 0, ending: false,

    boot() {
      EB.Save.load();
      const st = EB.Save.settings;
      EB.Audio.setVolume('music', st.music);
      EB.Audio.setVolume('sfx', st.sfx);
      const unlock = () => EB.Audio.unlock();
      window.addEventListener('pointerdown', unlock);
      window.addEventListener('keydown', unlock);
      // touch + pause button icons
      const icons = { left: 'arrowLeft', right: 'arrowRight', hold: 'hold', soft: 'arrowDown', cw: 'rotate', hard: 'drop' };
      document.querySelectorAll('[data-touch]').forEach((b) => { b.style.backgroundImage = `url(${EB.Pix.iconURL(icons[b.dataset.touch], 32)})`; });
      const pb = document.getElementById('pauseBtn');
      pb.style.backgroundImage = `url(${EB.Pix.iconURL('pause', 32)})`;
      pb.onclick = () => Game.pause();
      Game.applyTouch();
      window.addEventListener('resize', () => { if (Game.renderer) { Game.renderer.resize(); Game.placePause(); } });
      document.addEventListener('visibilitychange', () => { if (document.hidden && Game.battle && !Game.paused && Game.battle.state !== 'over' && !Game.cfg.online) Game.pause(); });
      EB.Track.open();
      // a shared Play a Friend link: ?room=ABCD opens the join screen with the code filled in
      let room = null;
      try { room = new URLSearchParams(location.search).get('room'); if (room) history.replaceState(null, '', location.pathname); } catch (e) { /* file:// */ }
      const go = () => (room ? EB.UI.friend(room) : EB.UI.title());
      if (document.fonts && document.fonts.load) document.fonts.load('12px "Press Start 2P"').then(go, go); else go();
    },

    applyTouch() {
      const m = Game.controlMode();
      document.body.classList.toggle('touch-on', m === 'buttons');
      document.body.classList.toggle('gest-on', m === 'tap' || m === 'drag');
      if (Game.renderer) { Game.renderer.resize(); Game.placePause(); }
    },

    // 'tap' | 'drag' | 'buttons' | 'keyboard' ('auto' picks tap on touch screens)
    controlMode() {
      let pref = EB.Save.settings.controls || 'drag';
      if (pref === 'gestures' || pref === 'both') pref = 'drag'; // older saves
      if (pref !== 'auto') return pref;
      const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      return coarse ? 'tap' : 'keyboard';
    },
    isTouch() { return (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0; },
    scheme() { const m = Game.controlMode(); return m === 'tap' || m === 'drag' ? m : null; },

    // pause button in the centre band, left of the timer, so it never covers a board
    placePause() {
      const L = Game.renderer && Game.renderer.L;
      const pb = document.getElementById('pauseBtn');
      if (!L) return;
      const size = Math.min(40, L.band - 6);
      const st = document.getElementById('stage').getBoundingClientRect();
      Object.assign(pb.style, { position: 'fixed', width: size + 'px', height: size + 'px', left: (st.left + L.colX) + 'px', top: (st.top + L.mid - size / 2) + 'px', right: 'auto', backgroundSize: '16px' });
    },

    hideBattle() {
      document.getElementById('battle').classList.add('hidden');
    },

    startBattle(cfg, onEnd) {
      Game.stopBattle();
      Game.cfg = cfg;
      Game.onEnd = onEnd;
      Game.paused = false;
      Game.ending = false;
      document.getElementById('screen').classList.add('hidden');
      document.getElementById('battle').classList.remove('hidden');
      modal.close();
      Game.applyTouch();
      // board size and match length come from Settings: the board fills the arena width
      const st = EB.Save.settings;
      const stage = document.getElementById('stage');
      // Play a Friend: both phones use the room's board size and rules, with no time limit
      const grid = cfg.grid || EB.ArenaRenderer.gridFor(stage.clientWidth, stage.clientHeight, st.cols || 15);
      EB.CONFIG.COLS = grid.cols;
      EB.CONFIG.ROWS = grid.rows;
      EB.CONFIG.DANGER_WARN_HEIGHT = grid.rows - EB.CONFIG.DANGER_ROWS - Math.max(3, Math.round(grid.rows * 0.2));
      EB.CONFIG.GARBAGE_MODE = (cfg.garbage || st.garbageMode) === 'classic' ? 'classic' : 'direct';
      EB.CONFIG.MATCH_TIME = cfg.online || !st.matchTime ? Infinity : st.matchTime * 60; // 0 / unset = no limit
      const b = new EB.Battle(Object.assign({ seed: EB.newSeed() }, cfg));
      if (cfg.online) cfg.online.battle = b;
      Game.battle = b;
      Game.renderer = new EB.ArenaRenderer(document.getElementById('cv'), b, { label: cfg.label, playerSub: cfg.playerSub, enemySub: cfg.enemySub, theme: cfg.theme });
      Game.placePause();
      Game.input = new EB.Input(b.player, { pause: () => Game.togglePause(), isPaused: () => Game.paused });
      Game.input.bindTouch(document.getElementById('touch'));
      stage.onpointerdown = stage.onpointermove = stage.onpointerup = stage.onpointercancel = null;
      // mouse / tap on the hero skill meter fires the skill (Q on keyboards)
      const skillOpts = EB.Input.touchOptions(b.player, stage, () => Game.renderer.L, null, st.sens);
      stage.onclick = (e) => { if (skillOpts.hitSkill(e.clientX, e.clientY)) b.player.useSkill(); };
      const scheme = Game.scheme();
      if (scheme) {
        Game.input.bindGestures(stage, EB.Input.touchOptions(b.player, stage, () => Game.renderer.L, scheme, st.sens || 'medium'));
        // touch help only on touch screens (the Drag default also applies on desktops)
        if (!st.touchHelpV2 && Game.isTouch()) Game.gestureHelp();
      }
      b.on(Game.audioHook);
      b.on((t, d) => { if (t === 'end') Game.finish(d); });
      EB.Audio.music(cfg.music || 'battle');
      let last = performance.now();
      const loop = (now) => {
        Game.raf = requestAnimationFrame(loop);
        let dt = Math.min(0.1, (now - last) / 1000);
        last = now;
        if (!Game.paused) {
          if (cfg.online) cfg.online.tick(dt);
          // fixed sub-steps keep gravity / AI timing stable on slow frames
          while (dt > 0) {
            const s = Math.min(dt, 1 / 120);
            Game.input.update(s);
            b.update(s);
            dt -= s;
          }
          Game.dangerBeat(now);
        }
        Game.renderer.render(Game.paused ? 0 : Math.min(0.1, (now - (Game._lastR || now)) / 1000));
        Game._lastR = now;
      };
      Game.raf = requestAnimationFrame(loop);
    },

    dangerBeat(now) {
      const b = Game.battle;
      if (!b || b.state === 'over' || b.state === 'countdown') return;
      if (b.player.stackHeight() >= EB.CONFIG.DANGER_WARN_HEIGHT && now - Game.heartbeat > 900) {
        Game.heartbeat = now;
        EB.Audio.sfx('danger');
      }
    },

    audioHook(t, d) {
      const quiet = d.side === 'bottom';
      const A = EB.Audio;
      switch (t) {
        case 'move': case 'rotate': case 'softdrop': case 'hold': if (!quiet) A.sfx(t); break;
        case 'harddrop': A.sfx('harddrop', null, quiet); break;
        case 'lock': A.sfx('lock', null, quiet); break;
        case 'clear': A.sfx('clear', d.n, quiet); break;
        case 'combo': A.sfx('combo', d.combo, quiet); break;
        case 'attack': A.sfx('attack', null, quiet); break;
        case 'hit': A.sfx('hit', null, !quiet); break;
        case 'garbage': A.sfx('garbage', null, quiet); break;
        case 'cancel': case 'absorb': A.sfx('cancel', null, quiet); break;
        case 'shield': A.sfx('shield', null, quiet); break;
        case 'purify': A.sfx('purify', null, quiet); break;
        case 'burst': A.sfx('burst', d.el, quiet); break;
        case 'skill': A.sfx('reaction', null, quiet); A.sfx('burst', d.el, quiet); break;
        case 'skillready': if (!quiet) A.sfx('combo', 6); break;
        case 'reaction': A.sfx('reaction', null, quiet); break;
        case 'tick': A.sfx('tick'); break;
        case 'go': A.sfx('go'); break;
        case 'sudden': A.sfx('sudden'); break;
      }
    },

    finish(res) {
      if (Game.ending) return;
      Game.ending = true;
      EB.Save.recordBattle(res);
      EB.Track.battle(res, Game.cfg);
      // Play a Friend: tell the friend's phone we topped out (or gave up)
      if (Game.cfg.online && res.winner !== 'player' && !res.disconnected) { Game.cfg.online.tick(1); EB.Net.raw({ t: 'dead' }); }
      EB.Audio.music(null);
      EB.Audio.sfx(res.winner === 'player' ? 'victory' : 'defeat');
      const cb = Game.onEnd;
      setTimeout(() => {
        if (Game.battle && Game.battle.result === res) {
          Game.stopBattle();
          if (cb) cb(res);
        }
      }, 1700);
    },

    stopBattle() {
      cancelAnimationFrame(Game.raf);
      if (Game.input) Game.input.detach();
      Game.input = null;
      Game.battle = null;
      Game.renderer = null;
      Game.paused = false;
    },

    gestureHelp(fromPause) {
      Game.paused = true;
      const row = (g, a) => `<div class="item"><div class="gest">${g}</div><div class="grow"><div class="t">${a}</div></div></div>`;
      const drag = Game.scheme() === 'drag';
      const box = modal.open(`<h2 style="text-align:center">Touch Controls</h2>
        <p class="small dim" style="text-align:center">Use your finger anywhere on the arena.</p>
        <div class="list">${drag ? `
          ${row('&larr; drag &rarr;', 'Move the block one column per step')}
          ${row('tap', 'Rotate clockwise')}
          ${row('&#x21bb; circle', 'Draw a circle: rotate in that direction')}` : `
          ${row('tap a column', 'The block moves to that column')}
          ${row('tap it again', 'Drop it there')}
          ${row('tap the block', 'Rotate clockwise')}
          ${row('&larr; slide &rarr;', 'Move the block slowly, one column at a time')}`}
          ${row('drag &darr;', 'Lower the block slowly: it follows your finger')}
          ${row('&darr; then &larr;&rarr;', 'Without lifting: slide it into a gap')}
          ${row('flick &darr;', 'Hard drop straight down')}
          ${row('flick &uarr;', 'Hold / swap card')}
          ${row('2-finger tap', 'Rotate counter-clockwise')}
          ${row('tap your hero', 'Use the hero skill when its meter glows')}
        </div>
        <div class="row center mt"><button class="btn primary" data-act="ok">Got it!</button></div>
        <p class="tiny dim" style="text-align:center">Settings &rarr; Controls changes the touch scheme.</p>`, true);
      bind(box.parentElement, {
        ok() {
          EB.Save.settings.touchHelpV2 = true; EB.Save.write();
          modal.close();
          if (fromPause) Game.pause(); else Game.paused = false;
        },
      });
    },

    togglePause() { if (Game.paused) Game.resume(); else Game.pause(); },

    pause() {
      const b = Game.battle;
      if (!b || b.state === 'over' || Game.paused) return;
      if (Game.cfg.online) return Game.onlineMenu();
      Game.paused = true;
      if (Game.input) Game.input.releaseAll();
      const st = EB.Save.settings;
      const box = modal.open(`<h2 style="text-align:center">PAUSED</h2>
        <div class="set-row"><span>Music</span><input type="range" min="0" max="1" step="0.05" value="${st.music}" data-v="music"></div>
        <div class="set-row"><span>Sound</span><input type="range" min="0" max="1" step="0.05" value="${st.sfx}" data-v="sfx"></div>
        <div class="list mt">
          <button class="btn primary wide" data-act="resume">Resume</button>
          <button class="btn wide" data-act="help">How to Play</button>
          ${Game.scheme() && Game.isTouch() ? '<button class="btn wide" data-act="gest">Touch Controls</button>' : ''}
          <button class="btn wide" data-act="quit">${Game.cfg.mode === 'run' ? 'Retreat to map' : 'Quit to menu'}</button>
        </div>
        <p class="tiny dim mt" style="text-align:center">${Game.cfg.mode === 'run' ? 'Retreating does not cost HP, but you must fight this battle again.' : ''}</p>`, true);
      box.querySelectorAll('[data-v]').forEach((inp) => {
        inp.oninput = () => { st[inp.dataset.v] = parseFloat(inp.value); EB.Audio.setVolume(inp.dataset.v, st[inp.dataset.v]); };
        inp.onchange = () => EB.Save.write();
      });
      bind(box.parentElement, {
        resume: () => Game.resume(),
        gest() { Game.paused = false; Game.gestureHelp(true); },
        help() {
          const b2 = modal.open(`<h2>Quick Help</h2><p class="small">Clear 2+ lines to attack. Clear while garbage is incoming to cancel it.
            Don't let your stack reach the dashed red danger line at your outer edge. After 2:00 the lower stack wins.</p>
            <p class="small">Fill an element's energy bar to trigger its Burst. Mix two elements in one clear for a Reaction.</p>
            <div class="row center"><button class="btn primary" data-act="ok">Back</button></div>`, true);
          bind(b2.parentElement, { ok: () => { Game.paused = false; Game.pause(); } });
        },
        quit() {
          const mode = Game.cfg.mode;
          modal.close();
          Game.stopBattle();
          EB.Audio.music(null);
          if (mode === 'run') EB.UI.map(); else EB.UI.title();
        },
      });
    },

    // Play a Friend can't stop time: the menu floats over the running match
    onlineMenu() {
      const b = Game.battle;
      const box = modal.open(`<h2 style="text-align:center">MATCH MENU</h2>
        <p class="small dim" style="text-align:center">The match keeps running while this is open.</p>
        <div class="list mt">
          <button class="btn primary wide" data-act="resume">Back to the match</button>
          <button class="btn wide" data-act="forfeit">Give up</button>
        </div>`, true);
      bind(box.parentElement, {
        resume: () => modal.close(),
        forfeit() { modal.close(); if (b.state !== 'over') { b.player.die('forfeit'); b.end('ai', 'You gave up'); } },
      });
    },

    resume() {
      modal.close();
      Game.paused = false;
    },
  };

  EB.Game = Game;
  window.addEventListener('DOMContentLoaded', () => Game.boot());
})(globalThis.EB = globalThis.EB || {});

</script>
</body>
</html>
