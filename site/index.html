  <script>/* js/systems/save.js */
// Save / Load System (localStorage). Stores settings, profile (unlocks + statistics) and
// the current run. Every access is guarded: the game still works when storage is blocked.
(function (EB) {
  'use strict';
  const KEY = 'elementalBlocks.v1';

  const DEFAULT_KEYS = {
    left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], soft: ['ArrowDown', 'KeyS'],
    cw: ['ArrowUp', 'KeyX'], ccw: ['KeyZ'], hard: ['Space'], hold: ['ShiftLeft', 'ShiftRight', 'KeyC'], skill: ['KeyQ'], pause: ['Escape', 'KeyP'],
  };

  // Battle defaults chosen in the arena prototype: Drag controls, Medium sensitivity,
  // 15 blocks per row, no time limit; Quick Battle: Normal AI, Elemental deck vs Volt Wisp.
  // (Keyboard keys always work too; Drag only affects touch.)
  // v4: Direct garbage (every cleared line sends 1 row straight to the opponent).
  const SETTINGS_VERSION = 4;
  const ARENA_DEFAULTS = () => ({
    controls: 'drag', sens: 'medium', cols: 15, matchTime: 0, garbageMode: 'direct',
    quickLevel: 1, quickDeck: 'chaos', quickFoe: 'volt_wisp',
    settingsVersion: SETTINGS_VERSION,
  });

  const defaults = () => ({
    settings: Object.assign({ analytics: true, music: 0.5, sfx: 0.7, shake: true, ghost: true, das: 0.14, arr: 0.035, keys: JSON.parse(JSON.stringify(DEFAULT_KEYS)) }, ARENA_DEFAULTS()),
    profile: {
      cards: {}, relics: {}, enemies: {},
      stats: { bestScore: 0, runsStarted: 0, runsWon: 0, dungeonsCleared: 0, battlesWon: 0, battlesLost: 0, lines: 0, sent: 0, pieces: 0, bestCombo: 0, bestPPM: 0, reactions: 0, quads: 0, playTime: 0 },
      tutorialSeen: false,
      maxDungeonCleared: 0,   // most bosses beaten in a single run (unlocks heroes)
      heroesAnnounced: [],    // heroes whose unlock was already shown
    },
    run: null,
  });

  const Save = {
    data: defaults(),
    DEFAULT_KEYS,
    load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const d = JSON.parse(raw);
          const base = defaults();
          Save.data = {
            settings: Object.assign(base.settings, d.settings || {}),
            profile: Object.assign(base.profile, d.profile || {}),
            run: d.run || null,
          };
          Save.data.profile.stats = Object.assign(defaults().profile.stats, (d.profile || {}).stats || {});
          for (const k in DEFAULT_KEYS) if (!Save.data.settings.keys[k]) Save.data.settings.keys[k] = DEFAULT_KEYS[k].slice();
          // saves from before the arena layout: move them onto the new battle defaults once
          const ver = (d.settings || {}).settingsVersion || 1;
          if (ver < 3) {
            Object.assign(Save.data.settings, ARENA_DEFAULTS());
            delete Save.data.settings.touch;
            Save.data.settings.touchHelpV2 = false;
          } else if (ver < 4) {
            // keep the player's own choices; only switch the garbage rule to Direct
            Save.data.settings.garbageMode = 'direct';
            Save.data.settings.settingsVersion = SETTINGS_VERSION;
          }
        }
      } catch (e) { Save.data = defaults(); }
      // older profiles: a won run cleared every dungeon; any dungeon clear means the first boss fell
      const pr = Save.data.profile;
      if (pr.maxDungeonCleared == null) pr.maxDungeonCleared = 0;
      if ((pr.stats.runsWon || 0) > 0) pr.maxDungeonCleared = Math.max(pr.maxDungeonCleared, (EB.DUNGEONS || []).length || 5);
      else if ((pr.stats.dungeonsCleared || 0) > 0) pr.maxDungeonCleared = Math.max(pr.maxDungeonCleared, 1);
      if (!Array.isArray(pr.heroesAnnounced)) pr.heroesAnnounced = (EB.unlockedHeroes ? EB.unlockedHeroes(pr) : []);
      // starter cards are always known
      for (const id of EB.CARD_IDS) if (EB.CARDS[id].element === 'neutral') Save.data.profile.cards[id] = true;
      return Save.data;
    },
    write() {
      try { localStorage.setItem(KEY, JSON.stringify(Save.data)); } catch (e) { /* storage blocked: keep playing */ }
    },
    get settings() { return Save.data.settings; },
    get profile() { return Save.data.profile; },
    get run() { return Save.data.run; },
    setRun(run) { Save.data.run = run; Save.write(); },
    discoverCard(id) { if (id && !Save.data.profile.cards[id]) { Save.data.profile.cards[id] = true; Save.write(); } },
    discoverRelic(id) { if (id && !Save.data.profile.relics[id]) { Save.data.profile.relics[id] = true; Save.write(); } },
    recordBattle(result) {
      const s = Save.data.profile.stats, p = result.player;
      if (result.winner === 'player') s.battlesWon++; else s.battlesLost++;
      s.lines += p.lines; s.sent += p.sent; s.pieces += p.pieces; s.reactions += p.reactions; s.quads += p.quads;
      s.bestCombo = Math.max(s.bestCombo, p.maxCombo);
      if (result.duration > 30) s.bestPPM = Math.max(s.bestPPM, Math.round(p.pieces / (result.duration / 60)));
      s.playTime += result.duration;
      Save.write();
    },
    resetAll() { Save.data = defaults(); Save.write(); Save.load(); },
  };

  EB.Save = Save;
})(globalThis.EB = globalThis.EB || {});

  <script>/* js/systems/track.js */
// Anonymous play statistics for the public stats page (spellbricks.gilagames.com/stats/).
// Sends small JSON events to /api/track on the same site: a random player id kept in
// localStorage, the device type and game results. No names, emails or IP addresses.
// Off when the game runs from a file, inside another page, or when the player turns it off
// in Settings -> Data.
(function (EB) {
  'use strict';
  const PID_KEY = 'spellbricks.pid';
  const ENDPOINT = '/api/track';
  const queue = [];
  let timer = 0, pid = null;

  const enabled = () => {
    try {
      if (!/^https?:$/.test(location.protocol) || window.top !== window.self) return false;
      if (!/(^|\.)gilagames\.com$|\.workers\.dev$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) return false;
    } catch (e) { return false; }
    return !EB.Save || EB.Save.settings.analytics !== false;
  };

  function playerId() {
    if (pid) return pid;
    try { pid = localStorage.getItem(PID_KEY); } catch (e) { /* storage blocked */ }
    if (!pid || !/^[a-z0-9]{12,40}$/.test(pid)) {
      const b = new Uint8Array(12);
      (window.crypto || {}).getRandomValues ? crypto.getRandomValues(b) : b.forEach((_, i) => { b[i] = Math.random() * 256; });
      pid = Array.from(b, (x) => x.toString(36).padStart(2, '0')).join('').slice(0, 20);
      try { localStorage.setItem(PID_KEY, pid); } catch (e) { /* this visit still counts */ }
    }
    return pid;
  }

  function flush(beacon) {
    clearTimeout(timer); timer = 0;
    if (!queue.length || !enabled()) { queue.length = 0; return; }
    const body = JSON.stringify({ pid: playerId(), events: queue.splice(0, 25) });
    try {
      if (beacon && navigator.sendBeacon) navigator.sendBeacon(ENDPOINT, new Blob([body], { type: 'application/json' }));
      else fetch(ENDPOINT, { method: 'POST', headers: { 'content-type': 'application/json' }, body, keepalive: true }).catch(() => {});
    } catch (e) { /* offline: stats are best effort */ }
    if (queue.length) timer = setTimeout(flush, 1000);
  }

  function send(type, data) {
    if (!enabled()) return;
    queue.push(Object.assign({ type }, data));
    if (!timer) timer = setTimeout(flush, 1500);
  }

  // Run score: floors cleared x100 + lines + attack sent, x difficulty (Easy 1, Normal 1.5, Hard 2),
  // +2000 for finishing all dungeons.
  function runScore(run, won) {
    const s = run.stats || {};
    const floors = EB.Track.floorsCleared(run, won);
    const mult = [1, 1.5, 2][run.difficulty || 0] || 1;
    return Math.round((floors * 100 + (s.lines || 0) + (s.sent || 0)) * mult) + (won ? 2000 : 0);
  }

  EB.Track = {
    enabled,
    floorsCleared: (run, won) => (run.dungeon || 0) * ((run.map && run.map.floors.length) || 8) + Math.max(0, (run.floor || 0) + (won ? 1 : 0)),
    runScore,
    open() {
      let touch = false;
      try { touch = matchMedia('(pointer: coarse)').matches; } catch (e) { /* old browser */ }
      send('open', { device: touch ? 'touch' : 'desktop' });
    },
    runStart(run) { send('run_start', { hero: run.hero || null, diff: run.difficulty }); },
    battle(res, cfg) {
      const t = (cfg && cfg.track) || {}, p = res.player;
      send('battle', {
        mode: cfg && cfg.mode, win: res.winner === 'player', hero: t.hero || null, diff: t.diff, enemy: t.enemy, tier: t.tier || 'normal',
        level: t.level, dungeon: t.dungeon, floor: t.floor, dur: res.duration, lines: p.lines, sent: p.sent, combo: p.maxCombo,
        ppm: res.duration > 0 ? p.pieces / (res.duration / 60) : 0, reactions: p.reactions,
      });
    },
    runEnd(run, won) {
      send('run_end', {
        win: won, hero: run.hero || null, diff: run.difficulty, dungeon: (run.dungeon || 0) + 1, floor: EB.Track.floorsCleared(run, won),
        lines: (run.stats || {}).lines, combo: (run.stats || {}).bestCombo, score: runScore(run, won),
      });
      flush();
    },
    unlock(hero) { send('unlock', { hero }); },
    flush,
  };

  window.addEventListener('pagehide', () => flush(true));
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(true); });
})(globalThis.EB = globalThis.EB || {});

// Play a Friend: two phones in one room (4-letter code) through the Worker's RoomDO.
// Each phone runs its own board with the full rules; the network carries what crosses over:
// attacks, fog / haste, board snapshots (drawn as the friend's board) and fx events.
(function (EB) {
  'use strict';
  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const EL = { fire: 'f', water: 'w', nature: 'n', lightning: 'l', neutral: 'u', garbage: 'g' };
  const EL_BACK = Object.fromEntries(Object.entries(EL).map(([k, v]) => [v, k]));
  const FORWARD = new Set(['clear', 'lock', 'garbage', 'popup', 'reaction', 'skill', 'skillready', 'burst', 'cancel', 'absorb', 'shield', 'purify']);
  const SNAP_EVERY = 0.07; // seconds between board snapshots (only sent when something changed)

  const Net = {
    ws: null, code: null, you: 0, players: [], status: 'idle', handlers: {},

    available() {
      try { return /^https?:$/.test(location.protocol) && /(^|\.)gilagames\.com$|\.workers\.dev$|^localhost$|^127\.0\.0\.1$/.test(location.hostname); } catch (e) { return false; }
    },
    newCode() {
      const b = new Uint8Array(4);
      crypto.getRandomValues(b);
      return Array.from(b, (x) => CODE_CHARS[x % CODE_CHARS.length]).join('');
    },
    cleanCode(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/[IO01]/g, '').slice(0, 4); },
    link(code) { return location.origin + location.pathname + '?room=' + code; },

    // on: { room(players, you), start(msg), msg(m), left(), closed(reason), full() }
    connect(code, hello, on) {
      Net.leave();
      Net.code = code; Net.handlers = on || {}; Net.status = 'connecting'; Net.hello = hello;
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      let ws;
      try { ws = new WebSocket(`${proto}//${location.host}/api/room/${code}`); } catch (e) { Net.fail('Could not connect.'); return; }
      Net.ws = ws;
      ws.onopen = () => { Net.status = 'open'; Net.raw({ t: 'hello', ...hello }); Net.ping = setInterval(() => Net.raw({ t: 'ping', id: Date.now() }), 20000); };
      ws.onmessage = (e) => {
        let m; try { m = JSON.parse(e.data); } catch (err) { return; }
        const h = Net.handlers;
        switch (m.t) {
          case 'room': Net.you = m.you; Net.players = m.players; if (h.room) h.room(m.players, m.you); break;
          case 'start': if (h.start) h.start(m); break;
          case 'full': Net.status = 'full'; if (h.full) h.full(); break;
          case 'left': if (Net.match) Net.match.friendLeft(); if (h.left) h.left(); break;
          case 'pong': break;
          default: if (Net.match) Net.match.onMessage(m);
        }
      };
      ws.onclose = () => {
        clearInterval(Net.ping);
        if (Net.ws !== ws) return;
        const was = Net.status; Net.status = 'closed'; Net.ws = null;
        if (Net.match) Net.match.friendLeft(true);
        if (was !== 'full' && Net.handlers.closed) Net.handlers.closed();
      };
      ws.onerror = () => {};
    },
    fail(msg) { Net.status = 'closed'; if (Net.handlers.closed) Net.handlers.closed(msg); },

      for (let c = 1; c < L.cols; c++) this.R(L.bx + c * cs, top, 1 / d, L.bh, gl);

  class Input {
    constructor(fighter, hooks) {

      this.ku = (e) => this.onKey(e, false);

      window.addEventListener('keydown', this.kd);
      window.addEventListener('keyup', this.ku);
      window.addEventListener('blur', this.blur);

      window.removeEventListener('keydown', this.kd);
      window.removeEventListener('keyup', this.ku);

    onKey(e, down) {

    press(act) {
      if (this.hooks.isPaused && this.hooks.isPaused() && act !== 'pause') return;
      EB.Audio.unlock();
      const f = this.f;
      switch (act) {
        case 'left': case 'right': {
          this.held[act] = true;
          this.dir = act === 'left' ? -1 : 1;

          f.move(this.dir);
          break;

        case 'soft': f.softDrop = true; break;
        case 'cw': f.rotate(1); break;
        case 'ccw': f.rotate(-1); break;
        case 'hard': f.hardDrop(); break;
        case 'hold': f.hold(); break;
        case 'skill': f.useSkill(); break;

        if (e.type !== 'pointerup' || paused() || G.axis === 'circle' || G.axis === 'done') return;
        if (G.two) { f.rotate(-1); return; }
        const flickDown = dy > 60 && vy > 0.8 && Math.abs(dx) < dy * 0.7;
        const flickUp = dy < -60 && vy < -0.7 && Math.abs(dx) < -dy * 0.7;
        if (flickDown) {
          // drop where the block was aimed: undo sideways steps made during the flick itself
          for (let i = G.moves.length - 1; i >= 0 && now - G.moves[i].t < 160; i--) f.move(-G.moves[i].dir);
          f.hardDrop();
          return;
        }
        if (flickUp) { f.hold(); return; }
        if (G.moved || dt > 350) return;
        // tapping the hero / skill meter in the info column fires the hero skill
        if (o.hitSkill && o.hitSkill(e.clientX, e.clientY)) { f.useSkill(); return; }
        if (!f.piece) return;
        // a tap
        if (mode === 'tap' && o.colAt) {
          // a quick tap right after a rotation is another rotation (the block may have kicked
          // sideways and slipped from under the finger), never a drop
          const rapidRotate = now - G.lastRot < 400;
          if (rapidRotate || (o.hitPiece && o.hitPiece(e.clientX, e.clientY))) { f.rotate(1); G.lastRot = now; return; }
          const target = xForCol(o.colAt(e.clientX));
          if (f.piece.x === target) f.hardDrop();
          else moveTo(target);
          return;
        }
        f.rotate(1);
      };
      el.onpointerup = end;
      el.onpointercancel = end;
    }

    // touch buttons: <button data-touch="left">
    bindTouch(root) {
      this.touchRoot = root;
      root.querySelectorAll('[data-touch]').forEach((btn) => {
        const act = btn.dataset.touch;
        const down = (e) => { e.preventDefault(); btn.classList.add('on'); this.press(act); };
        const up = (e) => { e.preventDefault(); btn.classList.remove('on'); this.release(act); };
        btn.onpointerdown = down;
        btn.onpointerup = up;
        btn.onpointerleave = up;
        btn.onpointercancel = up;
      });
    }
  }

  // Touch options for bindGestures on the arena layout (shared by the game and the prototype).
  // getL() returns the ArenaRenderer layout; sens is 'low' | 'medium' | 'high'.
  Input.touchOptions = (fighter, stage, getL, scheme, sens) => {
    const mul = { low: 1.3, medium: 1, high: 0.75 }[sens] || 1;
    const rect = () => stage.getBoundingClientRect();
    return {
      mode: scheme,
      stepPx: () => ({ low: 34, medium: 26, high: 18 }[sens] || 26),
      rowPx: () => Math.max(14, getL().cell) * mul,
      slidePx: () => Math.max(24, getL().cell * 1.6) * mul,
      colAt: (cx) => EB.util.clamp(Math.floor((cx - rect().left - getL().bx) / getL().cell), 0, EB.CONFIG.COLS - 1),
      hitSkill: (cx, cy) => {
        const s = getL().skillRect, r = rect();
        return !!s && cx - r.left >= s.x - 6 && cx - r.left <= s.x + s.w + 6 && cy - r.top >= s.y - 6 && cy - r.top <= s.y + s.h + 6;
      },
      // generous hit box: the block plus one cell around it, on your board
      hitPiece: (cx, cy) => {
        const p = fighter.piece; if (!p) return false;
        const L = getL(), r = rect();
        const col = (cx - r.left - L.bx) / L.cell, row = (cy - r.top - L.topY) / L.cell;
        return EB.SHAPES[p.shape].rots[p.rot].some(([dx, dy]) => Math.abs(col - (p.x + dx + 0.5)) < 1.5 && Math.abs(row - (p.y + dy + 0.5)) < 1.5);
      },
    };
  };

  EB.Input = Input;

// Small UI building blocks shared by the screens (card faces, relic rows, modal, toast).
(function (EB) {
  'use strict';
  const esc = (s) => EB.util.esc(s);

  const ico = (name, px, cls) => `<img class="${cls || ''}" src="${EB.Pix.iconURL(name, px || 32)}" alt="">`;

  // inst: {id, lvl, uid} or a card id string
  function cardHTML(inst, opt) {
    opt = opt || {};
    if (typeof inst === 'string') inst = { id: inst, lvl: 1 };
    const d = EB.CARDS[inst.id];
    const lvl = opt.lvl || inst.lvl || 1;
    const locked = opt.locked;
    const el = EB.ELEMENTS[d.element];
    const cls = ['card', 'el-' + d.element, 'r-' + d.rarity];
    if (opt.small) cls.push('small');
    if (opt.pick) cls.push('pick');
    if (locked) cls.push('locked');
    if (opt.sold) cls.push('sold');
    const attrs = opt.attrs || '';
    return `<div class="${cls.join(' ')}" ${opt.pick ? 'tabindex="0" role="button"' : ''} ${attrs}>
      <div class="top">${ico(d.element, 32)}<span class="name">${locked ? '???' : esc(d.name)}${lvl >= 2 ? '+' : ''}</span></div>
      <div class="art"><img src="${EB.Pix.shapeURL(d.shape, d.element, 16)}" alt="${d.shape} block"></div>
      <div class="meta"><span>${EB.RARITIES[d.rarity].name.toUpperCase()}</span><span class="el">${el.name.toUpperCase()}</span></div>
      <div class="desc">${locked ? 'Not discovered yet.' : esc(d.desc(lvl))}</div>
      ${lvl >= 2 ? '<div class="lvl">+</div>' : ''}
      ${opt.price != null ? `<div class="price">${ico('coin', 16)}${opt.price}</div>` : ''}
    </div>`;
  }

  function relicIcon(id, px) {
    const r = EB.RELICS[id];
    return `<img class="relic-ico" src="${EB.Pix.iconURL(r.icon, px || 32)}" alt="${esc(r.name)}" title="${esc(r.name + ': ' + r.desc)}">`;
  }

  function relicItem(id, extra) {
    const r = EB.RELICS[id];
    return `<div class="item">${ico(r.icon, 32)}<div class="grow"><div class="t">${esc(r.name)}</div><div class="d">${esc(r.desc)}</div></div>${extra || ''}</div>`;
  }

  function portraitURL(enemyId, px) {
    const e = EB.ENEMIES[enemyId];
    return EB.Pix.portraitURL({ enemy: enemyId }, px || 12);
  }

  // ---- modal ----
  const modal = {
    open(html, narrow) {
      const m = document.getElementById('modal');
      m.innerHTML = `<div class="box ${narrow ? 'narrow' : ''}">${html}</div>`;
      m.classList.remove('hidden');
      return m.firstElementChild;
    },
    close() {
      const m = document.getElementById('modal');
      m.classList.add('hidden');
      m.innerHTML = '';
    },
    get isOpen() { return !document.getElementById('modal').classList.contains('hidden'); },
  };

  let toastT = 0;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // Bind [data-act] clicks inside root to handlers. data-arg passed as string.
  function bind(root, handlers) {
    root.onclick = (e) => {
      const el = e.target.closest('[data-act]');
      if (!el || !root.contains(el) || el.disabled) return;
      const fn = handlers[el.dataset.act];
      if (fn) { EB.Audio.unlock(); EB.Audio.sfx('ui'); fn(el.dataset.arg, el, e); }
    };
    root.onkeydown = (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const el = e.target.closest('[data-act]');
      if (el && el.tagName !== 'BUTTON') { e.preventDefault(); el.click(); }
    };
  }

  // Pick a card from the run deck. filter(inst) -> bool. Resolves uid or null.
  function pickCard(run, title, filter, preview) {
    return new Promise((resolve) => {
      const list = run.deck.filter(filter || (() => true));
      const html = `<div class="row spread mb"><h2>${esc(title)}</h2><button class="btn sm" data-act="cancel">Cancel</button></div>
        ${list.length ? '' : '<p class="dim">No valid cards.</p>'}
        <div class="cards">${list.map((c) => cardHTML(c, { pick: true, small: true, attrs: `data-act="pick" data-arg="${c.uid}"` })).join('')}</div>`;
      const box = modal.open(html);
      bind(box.parentElement, {
        cancel() { modal.close(); resolve(null); },
        pick(uid) {
          const c = run.deck.find((x) => x.uid === uid);
          if (!preview) { modal.close(); resolve(uid); return; }
          const b2 = modal.open(`<h2>${esc(preview.title)}</h2>
            <div class="row center">${cardHTML(c)}<span style="font-size:20px">${preview.arrow || '→'}</span>${preview.after ? cardHTML(Object.assign({}, c, { lvl: (c.lvl || 1) + 1 })) : ''}</div>
            <div class="row center mt"><button class="btn" data-act="back">Back</button><button class="btn primary" data-act="ok">${esc(preview.ok)}</button></div>`, !preview.after);
          bind(b2.parentElement, {
            back() { modal.close(); pickCard(run, title, filter, preview).then(resolve); },
            ok() { modal.close(); resolve(uid); },
          });
        },
      });
    });
  }

  function hpBar(run) {
    const p = Math.max(0, run.hp / run.maxHp);
    const col = p > 0.5 ? '#5fd24a' : p > 0.25 ? '#ffb02a' : '#ff3355';
    return `<div class="bar" style="width:110px"><i style="width:${Math.round(p * 100)}%;background:${col}"></i></div>`;
  }

  EB.UIC = { ico, cardHTML, relicIcon, relicItem, portraitURL, modal, toast, bind, pickCard, hpBar, esc };
})(globalThis.EB = globalThis.EB || {});

          <button class="btn" data-act="quick">${ico('lightning', 32)} Quick Battle</button>

          </div>

        <div class="footer-note">Arrows / WASD move · Up/X rotate · Space drop · Shift hold · Esc pause</div>
      </div>`, {
        play() {
          if (run && run.status === 'map') {

    // ================= NEW RUN =================

      const render = () => UI.show(`<div class="wrap">
        <h2>New Run</h2>
        <h3>Choose your hero</h3>
        <div class="heroes-pick">${EB.HERO_IDS.map((id) => UI.heroCard(id, id === hero)).join('')}</div>
        <div class="panel"><p class="small">Fight through <b>${EB.DUNGEONS.length} dungeons</b> of 8 floors each: ${EB.DUNGEONS.map((d) => `<b style="color:${d.color}">${d.name}</b>`).join(', ')}.
          Each ends with a boss; the last is the <b style="color:var(--legendary)">${EB.ENEMIES[EB.DUNGEONS[EB.DUNGEONS.length - 1].pools.boss[0]].name}</b>. Beating a boss heals half your missing HP and lets you pick a relic.
          You start with ${EB.CONFIG.RUN_HP} HP and your hero's 12-card deck. Win battles to earn new cards, upgrades and relics.
          You lose HP from garbage you receive, and more when you lose a battle. At 0 HP the run ends.</p></div>
        <h3>Difficulty</h3>
        <div class="row mb">${DIFF.map((d, i) => `<button class="btn ${i === diff ? 'sel' : ''}" data-act="diff" data-arg="${i}">${d}</button>`).join('')}</div>
        <p class="small dim">${['Gentle opponents. Good for learning.', 'Foes get sharper after floor 3. The boss plays at Hard level.', 'Every foe is a tier smarter and faster. For experts.'][diff]}</p>
        <div class="row mt"><button class="btn" data-act="back">Back</button><button class="btn primary" data-act="go">${ico('sword', 32)} Begin</button></div>
      </div>`, {
        diff(a) { diff = +a; render(); },
        hero(a) { if (EB.heroUnlocked(a)) { hero = a; render(); } },
        back: UI.title,
        go() {
          save().settings.lastHero = hero;
          const run = Run().create({ difficulty: diff, hero });
          save().setRun(run);

    // hero card for the pick screens

          <img src="${EB.Pix.silhouetteURL({ hero: id }, 4)}" alt="">
          <span class="hp-body"><span class="hp-name">${esc(h.name.toUpperCase())}</span><span class="hp-title">${esc(h.title)} · ${EB.ELEMENTS[h.element].name}</span>

      }
      return `<button class="hero-pick ${selected ? 'sel' : ''}" style="--hc:${h.color}" data-act="hero" data-arg="${id}" aria-pressed="${selected}">
        <img src="${EB.Pix.portraitURL({ hero: id }, 4)}" alt="">
        <span class="hp-body">
          <span class="hp-name">${esc(h.name.toUpperCase())}</span><span class="hp-title">${esc(h.title)} · ${EB.ELEMENTS[h.element].name}</span>
          <span class="hp-line"><b>Passive · ${esc(h.passive.name)}:</b> ${esc(h.passive.desc)}</span>
          <span class="hp-line"><b>Skill · ${esc(h.skill.name)} (${h.skill.charge} lines):</b> ${esc(h.skill.desc)}</span>

          <h3>Your Deck</h3>
          <div class="row mb">${Object.keys(EB.PRESET_DECKS).map((k) => {
            const d = EB.PRESET_DECKS[k];
            return `<button class="btn sm ${k === deck ? 'sel' : ''}" data-act="deck" data-arg="${k}">${ico(d.el === 'mixed' ? 'gem' : d.el, 32)}${esc(d.name)}</button>`;
          }).join('')}</div>
          <div class="cards mb">${p.cards.map((id) => cardHTML(id, { small: true })).join('')}</div>
          <h3>Opponent</h3>
          <div class="row mb">${Object.keys(EB.ENEMIES).map((k) => `<button class="btn sm ${k === foe ? 'sel' : ''}" data-act="foe" data-arg="${k}"><img class="foe-ico" src="${portraitURL(k, 2)}" alt="">${esc(EB.ENEMIES[k].name)}</button>`).join('')}</div>
          <div class="row center mt"><button class="btn primary" data-act="fight">${ico('sword', 32)} FIGHT</button></div>
        </div>`, {
          back: UI.title,
          lvl(a) { lvl = +a; render(); },
          deck(a) { deck = a; render(); },
          foe(a) { foe = a; render(); },
          qhero(a) { if (!a || EB.heroUnlocked(a)) { hero = a; render(); } },

    startQuick(lvl, deck, foe, hero) {

      const cfg = {

        player: { name: hero ? EB.HEROES[hero].name : 'You', hero: hero || null, cards: EB.PRESET_DECKS[deck].cards.map((id) => EB.makeCard(id)), relics: [], portrait: hero ? { hero } : 'hero' },

      return {
        viewDeck: () => UI.deck(back),
        menu: () => { save().write(); UI.title(); },

    map() {
      const run = save().run;
      if (!run) return UI.title();
      if (run.status === 'lost' || run.status === 'won') return UI.runEnd(run.status === 'won');
      if (run.clearReward) return UI.dungeonCleared(); // boss beaten, next dungeon not entered yet
      EB.Audio.music('menu');
      const floors = run.map.floors;
      const F = floors.length;
      const cur = Run().currentNode(run);
      const pending = cur && !run.nodeDone;
      const avail = pending ? [] : Run().choices(run);
      const visited = new Set(run.path.map(([f, i]) => f + ':' + i));
      const pos = (n) => ({ x: 8 + n.x * 84, y: 100 - ((n.floor + 0.5) / F) * 100 });
      let lines = '';
      for (const fl of floors) for (const n of fl) for (const j of n.next) {
        const m = floors[n.floor + 1][j];
        const a = pos(n), b = pos(m);
        const on = visited.has(n.floor + ':' + n.idx) && visited.has(m.floor + ':' + m.idx);
        lines += `<line x1="${a.x}%" y1="${a.y}%" x2="${b.x}%" y2="${b.y}%" stroke="${on ? '#ffd35c' : '#7a9a7e'}" stroke-width="${on ? 4 : 3}" stroke-dasharray="${on ? '0' : '6 6'}"/>`;
      }
      let nodes = '';
      for (const fl of floors) for (const n of fl) {
        const t = EB.NODE_TYPES[n.type];
        const key = n.floor + ':' + n.idx;
        const isCur = cur && cur.floor === n.floor && cur.idx === n.idx;
        const isAvail = (run.floor + 1 === n.floor && avail.includes(n.idx)) || (isCur && pending);
        const cls = ['node', n.type === 'boss' ? 'boss' : '', visited.has(key) && !isCur ? 'done' : '', isCur ? 'cur' : '', isAvail ? 'avail' : '', !isAvail && !visited.has(key) ? 'locked' : ''].join(' ');
        const p = pos(n);
        const label = n.enemy ? EB.ENEMIES[n.enemy].name : t.name;
        nodes += `<button class="${cls}" style="left:${p.x}%;top:${p.y}%;--nc:${t.color};background-image:url(${EB.Pix.iconURL(t.icon, 64)})" ${isAvail ? `data-act="node" data-arg="${n.idx}"` : 'tabindex="-1"'} title="${esc(t.name + ': ' + t.desc)}" aria-label="${esc(t.name)}"><span class="lbl">${esc(label)}</span></button>`;
      }
      const height = Math.max(560, F * 86);
      const dun = EB.dungeonOf(run);
      UI.show(`${UI.topbar(run)}<div class="wrap">
        <div class="row spread"><h2 style="color:${dun.color}">${ico(dun.icon, 32)} Dungeon ${(run.dungeon || 0) + 1}/${EB.DUNGEONS.length}: ${esc(dun.name)}</h2><span class="small dim">${DIFF[run.difficulty]} run</span></div>
        <p class="small">Floor ${Math.max(1, run.floor + 1)} / ${F} <span class="dim">· ${esc(dun.blurb)}</span></p>
        <p class="small dim">${pending ? 'Finish the current encounter.' : run.floor < 0 ? 'Choose where to begin. The path climbs upward to the boss.' : 'Choose your next destination.'}</p>
        <div class="legend mb">${Object.values(EB.NODE_TYPES).map((t) => `<span>${ico(t.icon, 32)}${t.name}</span>`).join('')}</div>
        <div class="map" style="height:${height}px;background:radial-gradient(ellipse at 50% 8%, ${EB.util.rgba(dun.color, 0.16)}, transparent 60%)"><svg>${lines}</svg>${nodes}</div>
      </div>`, Object.assign(UI.topHandlers(UI.map), {
        node(idx) {
          if (!pending) { Run().enter(run, +idx); save().setRun(run); }
          UI.openNode();
        },
      }));
      // scroll so the current floor is visible
      const target = UI.root().querySelector('.node.avail, .node.cur');
      if (target) target.scrollIntoView({ block: 'center' });
    },

    openNode() {
      const run = save().run;
      const n = Run().currentNode(run);
      if (!n) return UI.map();
      switch (n.type) {
        case 'battle': case 'elite': case 'boss': return UI.preBattle(n);
        case 'shop': return UI.shop(n);
        case 'event': return UI.event(n);
        case 'rest': return UI.rest();
        case 'upgrade': return UI.forge();
      }
    },

    completeNode() {
      const run = save().run;
      run.nodeDone = true;
      save().setRun(run);
      UI.map();
    },

    // ================= BATTLE (run) =================
    preBattle(node) {
      const run = save().run;
      const en = Run().enemyFor(run, node);
      const e = en.def;
      const tierCol = { normal: '#d9dde6', elite: '#ff6a5a', boss: '#ffb02a' }[en.tier];
      const elName = e.el === 'mixed' ? 'All elements' : EB.ELEMENTS[e.el].name;
      UI.show(`${UI.topbar(run)}<div class="wrap">
        <div class="panel"><div class="row" style="gap:22px;align-items:flex-start">
          <img class="enemy-portrait" src="${portraitURL(en.id, 12)}" alt="">
          <div class="grow">
            <span class="pill" style="color:${tierCol}">${en.tier.toUpperCase()}</span>
            <span class="pill" style="color:var(--dim)">${EB.AI_LEVELS[en.level].name.toUpperCase()} AI${en.speed !== 1 ? ' · SPEED ' + en.speed.toFixed(2) : ''}</span>
            <h1 style="margin-top:10px">${esc(e.name)}</h1>
            <p class="quote">“${esc(e.quote)}”</p>
            <p class="small dim">Element: ${elName} · Deck: ${e.deck.length} cards</p>
            ${(e.relics || []).length ? `<div class="small">Relics:</div><div class="list" style="margin-top:6px">${e.relics.map((r) => relicItem(r)).join('')}</div>` : ''}
          </div>
        </div></div>
        <div class="panel small">
          <b>You are at the TOP</b> — your blocks fall down toward the centre. The enemy is at the BOTTOM.
          Clear 2+ lines to send garbage. Clearing lines while garbage is incoming cancels it.
          Reach the danger line and you lose. When time runs out, the lower stack wins.
        </div>
        <div class="row center"><button class="btn" data-act="viewDeck">View Deck</button><button class="btn primary" data-act="fight">${ico('sword', 32)} FIGHT!</button></div>
      </div>`, Object.assign(UI.topHandlers(() => UI.preBattle(node)), {
        fight() { UI.startRunBattle(node); },
      }));
    },

    startRunBattle(node) {
      const run = save().run;
      const en = Run().enemyFor(run, node);
      const e = en.def;
      save().profile.enemies[en.id] = true;
      const cfg = {
        mode: 'run', tier: en.tier,
        player: { name: run.hero ? EB.HEROES[run.hero].name : 'You', hero: run.hero || null, cards: run.deck, relics: run.relics, energy: run.blessings, portrait: run.hero ? { hero: run.hero } : 'hero' },
        enemy: { name: e.name, cards: EB.enemyDeck(e), relics: e.relics || [], level: en.level, speed: en.speed, portrait: { enemy: en.id } },
        label: `D${(run.dungeon || 0) + 1} F${node.floor + 1} · ${EB.NODE_TYPES[node.type].name.toUpperCase()}`,
        theme: EB.dungeonOf(run).color,
        playerSub: `HP ${run.hp}/${run.maxHp}`,
        enemySub: `${en.tier.toUpperCase()} · ${EB.AI_LEVELS[en.level].name.toUpperCase()}`,
        music: en.tier === 'boss' ? 'boss' : 'battle',
        track: { enemy: en.id, tier: en.tier, level: en.level, hero: run.hero || null, diff: run.difficulty, dungeon: (run.dungeon || 0) + 1, floor: node.floor + 1 },
      };
      EB.Game.startBattle(cfg, (res) => {
        const out = Run().afterBattle(run, res, en.tier);
        // achievement: bosses beaten in this run (unlocks heroes)
        if (res.winner === 'player' && en.tier === 'boss') {
          const pr = save().profile;
          pr.maxDungeonCleared = Math.max(pr.maxDungeonCleared || 0, (run.dungeon || 0) + 1);
          save().write();
        }
        save().setRun(run);
        UI.result(res, { run, out, node, tier: en.tier });
      });
    },

    result(res, ctx) {
      const win = res.winner === 'player', draw = res.winner === 'draw';
      const p = res.player, a = res.ai;
      const mins = Math.max(res.duration, 1) / 60;
      const rows = [
        ['Match time', EB.util.fmtTime(res.duration), ''],
        ['Lines cleared', p.lines, a.lines],
        ['Attack lines sent', p.sent, a.sent],
        ['Garbage received', p.received, a.received],
        ['Garbage countered', p.cancelled + p.absorbed, a.cancelled + a.absorbed],
        ['Highest combo', p.maxCombo, a.maxCombo],
        ['4-line clears', p.quads, a.quads],
        ['Pieces placed', p.pieces, a.pieces],
        ['Pieces / minute', Math.round(p.pieces / mins), Math.round(a.pieces / mins)],
        ['Reactions · Bursts', p.reactions + ' · ' + p.bursts, a.reactions + ' · ' + a.bursts],
        ['Final stack height', p.height, a.height],
      ];
      let runInfo = '', actions = '';
      const h = {};
      if (ctx.pvp) {
        actions = `<button class="btn" data-act="leave">Leave room</button><button class="btn primary" data-act="again" ${EB.Net.ws ? '' : 'disabled'}>Rematch</button>`;
        h.leave = () => { EB.Net.leave(); UI.title(); };
        h.again = () => {
          EB.Net.ready(true);
          const b = modal.open(`<h2 style="text-align:center">Rematch</h2><p class="small" style="text-align:center">Waiting for your friend to press Rematch…</p>
            <div class="row center mt"><button class="btn" data-act="cancel">Cancel</button></div>`, true);
          bind(b.parentElement, { cancel: () => { EB.Net.ready(false); modal.close(); } });
        };
      } else if (ctx.quick) {
        actions = `<button class="btn" data-act="menu">Menu</button><button class="btn" data-act="setup">Change Setup</button><button class="btn primary" data-act="again">Rematch</button>`;
        h.menu = UI.title; h.setup = UI.quick; h.again = ctx.rematch;
      } else {
        const run = ctx.run, out = ctx.out;
        runInfo = `<div class="row center mt small">
          <span>${ico('heart', 32)} -${out.damage} HP → ${run.hp}/${run.maxHp}</span>
          ${out.gold ? `<span>${ico('coin', 32)} +${out.gold} gold</span>` : ''}
        </div>`;
        if (run.status === 'lost') {
          actions = `<button class="btn primary" data-act="end">Continue</button>`;
          h.end = () => UI.runEnd(false);
        } else if (win) {
          actions = `<button class="btn primary" data-act="reward">${ico('gem', 32)} Choose Reward</button>`;
          h.reward = () => UI.rewards(ctx.tier);
        } else if (ctx.tier === 'boss') {
          actions = `<button class="btn primary" data-act="retry">Try the boss again</button>`;
          h.retry = () => UI.map();
        } else {
          actions = `<button class="btn primary" data-act="cont">Continue</button>`;
          h.cont = () => UI.completeNode();
        }
      }
      UI.show(`<div class="wrap">
        <div class="result-title ${win ? 'win' : 'lose'}">${win ? 'VICTORY!' : draw ? 'DRAW' : 'DEFEAT'}</div>
        <p class="center small dim" style="text-align:center">${esc(res.reason)}</p>
        <div class="panel"><div class="statgrid">
          <span class="h"></span><span class="h you">YOU</span><span class="h foe">${ctx.pvp ? 'FRIEND' : 'FOE'}</span>
          ${rows.map(([k, x, y]) => `<span class="small">${k}</span><span class="you">${x}</span><span class="foe">${y}</span>`).join('')}
        </div>${runInfo}</div>
        <div class="row center">${actions}</div>
      </div>`, h);
    },

    // ================= PLAY A FRIEND (two phones, one room code) =================
    friend(code) {
      const N = EB.Net, st = save().settings;
      let hero = EB.HEROES[st.friendHero] ? st.friendHero : (st.lastHero && EB.HEROES[st.lastHero] ? st.lastHero : 'ignis');
      let join = N.cleanCode(code || '');
      if (!N.available()) {
        return UI.show(`<div class="wrap"><div class="row spread"><h2>Play a Friend</h2><button class="btn sm" data-act="back">Back</button></div>
          <div class="panel"><p class="small">Playing with a friend needs the website version. Open <b>spellbricks.gilagames.com</b> on both phones.</p></div></div>`, { back: UI.title });
      }
      const render = () => {
        UI.show(`<div class="wrap">
          <div class="row spread"><h2>Play a Friend</h2><button class="btn sm" data-act="back">Back</button></div>
          <p class="small dim">Battle a friend on their own phone. One of you creates a room and shares the code; the other joins with it. Every hero is open here.</p>
          <h3>Your hero</h3>
          <div class="row mb">${EB.HERO_IDS.map((id) => `<button class="btn sm ${id === hero ? 'sel' : ''}" data-act="hero" data-arg="${id}"><img class="foe-ico" src="${EB.Pix.portraitURL({ hero: id }, 2)}" alt="">${esc(EB.HEROES[id].name)}</button>`).join('')}</div>
          <p class="tiny dim mb">${esc(EB.HEROES[hero].title)} · ${esc(EB.HEROES[hero].passive.name)}: ${esc(EB.HEROES[hero].passive.desc)} · Skill ${esc(EB.HEROES[hero].skill.name)}: ${esc(EB.HEROES[hero].skill.desc)}</p>
          <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
            <div class="panel"><h3>Create a room</h3><p class="small">You get a 4-letter code to send to your friend.</p>
              <button class="btn primary wide" data-act="create">${ico('sword', 32)} Create room</button></div>
            <div class="panel"><h3>Join a room</h3><p class="small">Type the code your friend sent you.</p>
              <div class="row"><input id="roomCode" class="code-input" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" value="${esc(join)}" aria-label="Room code">
              <button class="btn primary" data-act="join">Join</button></div></div>
          </div>
        </div>`, {
          back: UI.title,
          hero(a) { if (EB.HEROES[a]) { hero = a; st.friendHero = a; save().write(); join = N.cleanCode((document.getElementById('roomCode') || {}).value); render(); } },
          create() { UI.lobby(N.newCode(), hero); },
          join() {
            const c = N.cleanCode(document.getElementById('roomCode').value);
            if (c.length !== 4) { toast('Room codes have 4 letters'); return; }
            UI.lobby(c, hero);
          },
        });
        const inp = document.getElementById('roomCode');
        inp.oninput = () => { inp.value = N.cleanCode(inp.value); };
        inp.onkeydown = (e) => { if (e.key === 'Enter') document.querySelector('[data-act="join"]').click(); };
      };
      render();
      if (join.length === 4) UI.lobby(join, hero);
    },

    lobby(code, hero) {
      const N = EB.Net, st = save().settings;
      const g = EB.ArenaRenderer.gridFor(window.innerWidth, window.innerHeight, st.cols || 15);
      let note = 'Connecting…', state = 'wait', onLobby = true;
      const view = () => {
        if (EB.Game.battle || !onLobby) return; // during a match / on the result screen the lobby stays hidden
        const me = N.players.find((p) => p.slot === N.you), friend = N.players.find((p) => p.slot !== N.you);
        const who = (p) => `<div class="item"><img src="${EB.Pix.portraitURL({ hero: p.hero || 'ignis' }, 3)}" alt="" style="width:40px;height:49px"><div class="grow"><div class="t">${p.slot === N.you ? 'You' : 'Friend'} · ${esc((EB.HEROES[p.hero] || {}).name || '')}</div></div></div>`;
        UI.show(`<div class="wrap" style="text-align:center">
          <div class="row spread"><h2>Room</h2><button class="btn sm" data-act="leave">Leave</button></div>
          <p class="small dim">Room code</p>
          <div class="room-code">${esc(code)}</div>
          <div class="row center mb"><button class="btn sm" data-act="share">Share link</button><button class="btn sm" data-act="copy">Copy code</button></div>
          <div class="panel" style="text-align:left"><div class="list">${me ? who(me) : ''}${friend ? who(friend) : `<div class="item"><span class="spin" aria-hidden="true"></span><div class="grow"><div class="t dim">Waiting for your friend…</div><div class="d">Send them the code or the link. They open the game, tap Play a Friend and join.</div></div></div>`}</div></div>
          <p class="small ${state === 'err' ? 'lose' : 'dim'}">${esc(note)}</p>
          ${state === 'err' ? '<button class="btn primary" data-act="retry">Try again</button>' : ''}
        </div>`, {
          leave() { N.leave(); UI.friend(); },
          retry() { connect(); },
          copy() { try { navigator.clipboard.writeText(code).then(() => toast('Code copied'), () => toast(code)); } catch (e) { toast(code); } },
          share() {
            const url = N.link(code), text = `Battle me in Spellbricks! Room code ${code}`;
            if (navigator.share) navigator.share({ title: 'Spellbricks', text, url }).catch(() => {});
            else { try { navigator.clipboard.writeText(url).then(() => toast('Link copied'), () => toast(url)); } catch (e) { toast(url); } }
          },
        });
      };
      const connect = () => {
        note = 'Connecting…'; state = 'wait'; view();
        N.connect(code, { hero, cols: st.cols || 15, rows: g.rows, garbage: st.garbageMode === 'classic' ? 'classic' : 'direct' }, {
          room(players) { note = players.length < 2 ? 'Room is open.' : 'Friend found! Starting…'; state = 'ok'; view(); },
          start(msg) { onLobby = false; UI.startFriend(msg, hero, code); },
          full() { note = 'This room already has two players. Check the code or create a new room.'; state = 'err'; view(); },
          left() { if (!EB.Game.battle) { note = 'Your friend left the room. Waiting for them to come back…'; modal.close(); onLobby = true; view(); } },
          closed(msg) { if (EB.Game.battle) return; note = msg || 'Connection lost.'; state = 'err'; modal.close(); onLobby = true; view(); },
        });
      };
      UI.lobbyView = view;
      connect();
    },

    startFriend(msg, hero, code) {
      modal.close();
      const foe = msg.foe || {}, fh = EB.HEROES[foe.hero] ? foe.hero : 'ignis';
      const deck = (id) => EB.HEROES[id].deck.map((c) => EB.makeCard(c));
      const match = EB.Net.makeMatch();
      const cfg = {
        mode: 'pvp', online: match, grid: { cols: msg.cols, rows: msg.rows }, garbage: msg.garbage, seed: (msg.seed + EB.Net.you * 7919) >>> 0,
        player: { name: EB.HEROES[hero].name, hero, cards: deck(hero), relics: [], portrait: { hero } },
        enemy: { name: EB.HEROES[fh].name, hero: fh, cards: deck(fh), relics: [], level: 0, portrait: { hero: fh } },
        label: 'VS FRIEND', playerSub: 'ROOM ' + code, enemySub: 'FRIEND',
        music: 'battle', track: { hero, enemy: fh, tier: 'normal' },
      };
      EB.Game.startBattle(cfg, (res) => {
        EB.Net.match = null;
        UI.result(res, { pvp: true });
      });
    },

    // ================= REWARDS =================
    rewards(tier) {
      const run = save().run;
      const opts = Run().rewards(run, tier);
      save().setRun(run);
      opts.forEach((o) => { if (o.type === 'card') save().discoverCard(o.cardId); if (o.type === 'relic') save().discoverRelic(o.relicId); });
      const finish = () => {
        if (tier === 'boss' && !Run().lastDungeon(run)) UI.dungeonCleared();
        else if (tier === 'boss') { run.status = 'won'; save().setRun(run); UI.runEnd(true); }
        else UI.completeNode();
      };
      const render = () => UI.show(`${UI.topbar(run)}<div class="wrap">
        <h2 class="center" style="text-align:center">Choose a Reward</h2>
        <p class="small dim" style="text-align:center">Pick one. Choose wisely — it shapes your deck.</p>
        <div class="rewards mt">${opts.map((o, i) => {
          const d = Run().describeReward(o);
          let art = '';
          if (o.type === 'card') art = cardHTML(o.cardId, { small: true });
          else if (o.type === 'relic') art = `<img class="big" src="${EB.Pix.iconURL(EB.RELICS[o.relicId].icon, 64)}" alt="">`;
          else art = `<img class="big" src="${EB.Pix.iconURL({ gold: 'coin', heal: 'heart', upgrade: 'hammer', remove: 'skull', blessing: o.el || 'gem' }[o.type], 64)}" alt="">`;
          return `<button class="reward" data-act="pick" data-arg="${i}"><span class="kind">${d.title.toUpperCase()}</span>${art}<span class="rname">${esc(d.name)}</span><span class="rdesc">${esc(d.desc)}</span></button>`;
        }).join('')}</div>
        <div class="row center mt"><button class="btn ghost" data-act="skip">Skip reward</button></div>
      </div>`, Object.assign(UI.topHandlers(render), {
        skip: finish,
        pick(i) {
          const o = opts[+i];
          if (o.type === 'upgrade') {
            pickCard(run, 'Upgrade a card', (c) => (c.lvl || 1) < 2, { title: 'Upgrade?', ok: 'Upgrade', after: true }).then((uid) => {
              if (!uid) return;
              Run().upgradeCard(run, uid); save().setRun(run); toast('Card upgraded!'); EB.Audio.sfx('buy'); finish();
            });
            return;
          }
          if (o.type === 'remove') {
            pickCard(run, 'Remove a card', null, { title: 'Remove this card?', ok: 'Remove', arrow: '✕' }).then((uid) => {
              if (!uid) return;
              Run().removeCard(run, uid); save().setRun(run); toast('Card removed.'); finish();
            });
            return;
          }
          Run().applyReward(run, o);
          if (o.type === 'card') save().discoverCard(o.cardId);
          if (o.type === 'relic') save().discoverRelic(o.relicId);
          save().setRun(run);
          EB.Audio.sfx('buy');
          toast(Run().describeReward(o).name + '!');
          finish();
        },
      }));
      render();
    },

    // ================= SHOP =================
    shop(node) {
      const run = save().run;
      const shop = Run().shop(run, node);
      save().setRun(run);
      shop.cards.forEach((c) => save().discoverCard(c.cardId));
      const render = () => UI.show(`${UI.topbar(run)}<div class="wrap">
        <div class="row spread"><h2>${ico('coin', 32)} Shop</h2><button class="btn" data-act="leave">Leave</button></div>
        <p class="small dim">"Fine blocks, fresh from the quarry. No refunds."</p>
        <h3 class="mt">Cards</h3>
        <div class="cards mb" style="padding-bottom:24px">${shop.cards.map((c, i) => cardHTML(c.cardId, { small: true, pick: !c.sold, sold: c.sold, price: c.price, attrs: c.sold ? '' : `data-act="buyCard" data-arg="${i}"` })).join('')}</div>
        <h3>Relics</h3>
        <div class="list mb">${shop.relics.map((r, i) => relicItem(r.relicId, r.sold ? '<span class="small dim">SOLD</span>' : `<button class="btn sm" data-act="buyRelic" data-arg="${i}" ${run.gold < r.price ? 'disabled' : ''}>${ico('coin', 32)}${r.price}</button>`)).join('') || '<p class="dim small">Sold out.</p>'}</div>
        <h3>Services</h3>
        <div class="list">
          <div class="item">${ico('skull', 32)}<div class="grow"><div class="t">Remove a card</div><div class="d">Thin your deck (min ${EB.CONFIG.MIN_DECK} cards).</div></div>
            ${shop.removed ? '<span class="small dim">USED</span>' : `<button class="btn sm" data-act="remove" ${run.gold < shop.removePrice || run.deck.length <= EB.CONFIG.MIN_DECK ? 'disabled' : ''}>${ico('coin', 32)}${shop.removePrice}</button>`}</div>
          <div class="item">${ico('heart', 32)}<div class="grow"><div class="t">Healing tonic</div><div class="d">Restore ${shop.heal.amount} HP.</div></div>
            ${shop.heal.sold ? '<span class="small dim">SOLD</span>' : `<button class="btn sm" data-act="heal" ${run.gold < shop.heal.price || run.hp >= run.maxHp ? 'disabled' : ''}>${ico('coin', 32)}${shop.heal.price}</button>`}</div>
        </div>
      </div>`, Object.assign(UI.topHandlers(render), {
        leave: () => UI.completeNode(),
        buyCard(i) {
          const c = shop.cards[+i];
          if (c.sold) return;
          if (run.gold < c.price) { toast('Not enough gold.'); return; }
          run.gold -= c.price; c.sold = true;
          run.deck.push(EB.makeCard(c.cardId));
          save().setRun(run); EB.Audio.sfx('buy'); toast('Bought ' + EB.CARDS[c.cardId].name);
          render();
        },
        buyRelic(i) {
          const r = shop.relics[+i];
          if (r.sold || run.gold < r.price) return;
          run.gold -= r.price; r.sold = true; run.relics.push(r.relicId);
          save().discoverRelic(r.relicId); save().setRun(run); EB.Audio.sfx('buy'); toast('Got ' + EB.RELICS[r.relicId].name);
          render();
        },
        remove() {
          pickCard(run, 'Remove a card', null, { title: 'Remove this card?', ok: 'Remove', arrow: '✕' }).then((uid) => {
            if (!uid) return;
            run.gold -= shop.removePrice; shop.removed = true; run.removals++;
            Run().removeCard(run, uid); save().setRun(run); toast('Card removed.');
            render();
          });
        },
        heal() {
          run.gold -= shop.heal.price; shop.heal.sold = true;
          run.hp = Math.min(run.maxHp, run.hp + shop.heal.amount);
          save().setRun(run); EB.Audio.sfx('buy'); render();
        },
      }));
      render();
    },

    // ================= EVENT =================
    event(node) {
      const run = save().run;
      const ev = Run().pickEvent(run, node);
      save().setRun(run);
      const rng = Run().rng(run);
      const api = {
        rng,
        randomCard: (o) => Run().randomCard(rng, o),
        addCard: (id) => { run.deck.push(EB.makeCard(id)); save().discoverCard(id); },
        randomRelic: () => Run().randomRelic(run, rng),
        addRelic: (id) => { run.relics.push(id); save().discoverRelic(id); },
        upgradeRandom(n) {
          const ups = rng.shuffle(Run().upgradable(run).slice());
          ups.slice(0, n).forEach((c) => Run().upgradeCard(run, c.uid));
          return Math.min(n, ups.length);
        },
        pickUpgrade: () => pickCard(run, 'Upgrade a card', (c) => (c.lvl || 1) < 2, { title: 'Upgrade?', ok: 'Upgrade', after: true })
          .then((uid) => (uid && Run().upgradeCard(run, uid) ? 'The hammer rings. Your card grows stronger.' : 'You leave the anvil untouched.')),
        pickRemove: () => pickCard(run, 'Remove a card', null, { title: 'Wash away this card?', ok: 'Remove', arrow: '✕' })
          .then((uid) => (uid && Run().removeCard(run, uid) ? 'The card dissolves in the spring.' : 'You change your mind.')),
        transformStone() {
          const stones = run.deck.filter((c) => EB.CARDS[c.id].element === 'neutral');
          const c = rng.pick(stones);
          const shape = EB.CARDS[c.id].shape;
          const pool = EB.CARD_IDS.filter((id) => EB.CARDS[id].shape === shape && EB.CARDS[id].element !== 'neutral' && EB.CARDS[id].rarity !== 'legendary');
          const old = EB.CARDS[c.id].name;
          c.id = rng.pick(pool);
          save().discoverCard(c.id);
          return `${old} is reforged into ${EB.CARDS[c.id].name}!`;
        },
        pickCardFrom: (n, minR) => new Promise((resolve) => {
          const ids = [];
          for (let i = 0; i < n; i++) ids.push(Run().randomCard(rng, { minRarity: minR, tier: 'elite', exclude: ids }));
          ids.forEach((id) => save().discoverCard(id));
          const b = modal.open(`<h2>Choose a card</h2><div class="cards">${ids.map((id, i) => cardHTML(id, { pick: true, attrs: `data-act="p" data-arg="${i}"` })).join('')}</div>
            <div class="row center mt"><button class="btn ghost" data-act="skip">Skip</button></div>`);
          bind(b.parentElement, {
            p(i) { modal.close(); api.addCard(ids[+i]); resolve(`You learn ${EB.CARDS[ids[+i]].name}.`); },
            skip() { modal.close(); resolve('You put the book back.'); },
          });
        }),
      };
      const done = (text) => {
        Run().saveRng(run, rng);
        save().setRun(run);
        UI.show(`${UI.topbar(run)}<div class="wrap"><div class="panel center" style="text-align:center">
          <img src="${EB.Pix.iconURL(ev.icon, 64)}" width="64" height="64" alt=""><h2 class="mt">${esc(ev.title)}</h2><p class="small">${esc(text)}</p>
          <button class="btn primary mt" data-act="cont">Continue</button></div></div>`, Object.assign(UI.topHandlers(() => done(text)), { cont: () => UI.completeNode() }));
      };
      const render = () => UI.show(`${UI.topbar(run)}<div class="wrap"><div class="panel">
        <div class="row" style="gap:16px"><img src="${EB.Pix.iconURL(ev.icon, 64)}" width="64" height="64" alt=""><h2 style="margin:0">${esc(ev.title)}</h2></div>
        <p class="small mt">${esc(ev.text)}</p>
        <div class="list mt">${ev.options.map((o, i) => {
          const ok = !o.can || o.can(run);
          return `<button class="btn wide" style="justify-content:space-between;text-align:left" data-act="opt" data-arg="${i}" ${ok ? '' : 'disabled'}><span>${esc(o.label)}</span><span class="tiny dim">${esc(o.desc)}</span></button>`;
        }).join('')}</div>
      </div></div>`, Object.assign(UI.topHandlers(render), {
        opt(i) {
          const o = ev.options[+i];
          Promise.resolve(o.run(run, api)).then(done);
        },
      }));
      render();
    },

    // ================= REST / FORGE =================

      const render = () => UI.show(`${UI.topbar(run)}<div class="wrap"><div class="panel" style="text-align:center">
        <img src="${EB.Pix.iconURL('campfire', 64)}" width="64" height="64" alt=""><h2 class="mt">Rest Site</h2>
        <p class="small dim">The fire crackles. Embers drift upward like tiny falling blocks in reverse.</p>
        <div class="row center mt">
          <button class="btn good" data-act="heal" ${run.hp >= run.maxHp ? 'disabled' : ''}>${ico('heart', 32)} Rest: heal ${heal} HP</button>

    // ================= DUNGEON CLEARED =================
    dungeonCleared() {
      const run = save().run;
      const done = EB.dungeonOf(run), next = EB.DUNGEONS[(run.dungeon || 0) + 1];
      if (!run.clearReward) {
        // decided once and saved, so closing the game here can't reroll it
        run.clearReward = { heal: Run().dungeonHeal(run), relics: Run().dungeonRelics(run) };
        run.hp = Math.min(run.maxHp, run.hp + run.clearReward.heal);
        save().profile.stats.dungeonsCleared = (save().profile.stats.dungeonsCleared || 0) + 1;
        save().setRun(run);
      }
      const cr = run.clearReward;
      cr.relics.forEach((r) => save().discoverRelic(r));
      EB.Audio.music('victory');
      const go = () => {
        delete run.clearReward;
        Run().nextDungeon(run);
        save().setRun(run);
        UI.map();
      };
      const render = () => UI.show(`${UI.topbar(run)}<div class="wrap" style="text-align:center">
        <div class="result-title win">DUNGEON CLEARED!</div>
        <p class="small"><b style="color:${done.color}">${esc(done.name)}</b> is behind you. ${cr.heal ? `You rest and recover <b>${cr.heal} HP</b>.` : 'You are at full health.'}</p>
        ${cr.picked ? `<p class="small">You took <b>${esc(EB.RELICS[cr.picked].name)}</b>.</p>` : `
        <h3 class="mt">Choose a relic</h3>
        <div class="list" style="text-align:left;max-width:560px;margin:0 auto">${cr.relics.map((r) => relicItem(r, `<button class="btn sm" data-act="relic" data-arg="${r}">Take</button>`)).join('') || '<p class="dim small">You already own every relic.</p>'}</div>
        <button class="btn ghost mt" data-act="skip">Skip relic</button>`}
        <div class="panel mt" style="text-align:left"><h3 style="color:${next.color}">${ico(next.icon, 32)} Next: ${esc(next.name)}</h3><p class="small">${esc(next.blurb)}</p></div>
        <button class="btn primary" data-act="go" ${cr.picked || cr.skipped || !cr.relics.length ? '' : 'disabled'}>${ico('sword', 32)} Enter ${esc(next.name)}</button>
      </div>`, Object.assign(UI.topHandlers(render), {
        relic(id) { if (cr.picked) return; cr.picked = id; run.relics.push(id); save().setRun(run); EB.Audio.sfx('buy'); render(); },
        skip() { cr.skipped = true; save().setRun(run); render(); },
        go,
      }));
      render();
      setTimeout(() => UI.announceUnlocks(), 300);
    },

    // show any hero unlocked since the last announcement
    announceUnlocks() {
      const pr = save().profile;
      const fresh = EB.unlockedHeroes(pr).filter((id) => EB.HEROES[id].unlock && !pr.heroesAnnounced.includes(id));
      if (!fresh.length) return;
      pr.heroesAnnounced.push(...fresh);
      fresh.forEach((h) => EB.Track.unlock(h));
      save().write();
      EB.Audio.sfx('victory');
      const b = modal.open(`<div class="result-title win" style="font-size:22px">HERO UNLOCKED!</div>
        <div class="list mt">${fresh.map((id) => { const h = EB.HEROES[id]; return `<div class="item"><img src="${EB.Pix.portraitURL({ hero: id }, 3)}" alt="" style="width:54px;height:66px">
          <div class="grow"><div class="t" style="color:${h.color}">${esc(h.name)}, ${esc(h.title)}</div><div class="d">${esc(h.skill.name)}: ${esc(h.skill.desc)}</div></div></div>`; }).join('')}</div>
        <p class="small dim mt">Pick them on the New Run screen or in Quick Battle.</p>
        <div class="row center mt"><button class="btn primary" data-act="ok">Great!</button></div>`, true);
      bind(b.parentElement, { ok: () => modal.close() });
    },

    // ================= RUN END =================
    runEnd(won) {
      const run = save().run;
      if (!run) return UI.title();
      const st = save().profile.stats;
      if (!run.recorded) { run.recorded = true; if (won) st.runsWon++; if (!run.score) run.score = EB.Track.runScore(run, won); if (run.score > (st.bestScore || 0)) st.bestScore = run.score; save().write(); EB.Track.runEnd(run, won); }
      setTimeout(() => UI.announceUnlocks(), 300);
      EB.Audio.music(won ? 'victory' : null);
      if (!won) EB.Audio.sfx('defeat');
      const s = run.stats;
      UI.show(`<div class="wrap" style="text-align:center">
        <div class="result-title ${won ? 'win' : 'lose'}">${won ? 'RUN COMPLETE!' : 'RUN OVER'}</div>
        <p class="small dim">${won ? `The ${esc(EB.ENEMIES[EB.DUNGEONS[EB.DUNGEONS.length - 1].pools.boss[0]].name)} falls and the eclipse breaks. All ${EB.DUNGEONS.length} dungeons are cleared.` : `Your stack crumbles in ${esc(EB.dungeonOf(run).name)}. The elements will wait for your return.`}</p>
        <div class="panel" style="text-align:left"><div class="statgrid" style="grid-template-columns:1fr auto">
          <span class="small">Score</span><span class="you">${run.score || 0}${run.score && run.score >= (st.bestScore || 0) ? ' · BEST!' : ''}</span>
          <span class="small">Dungeon reached</span><span class="you">${(run.dungeon || 0) + 1} / ${EB.DUNGEONS.length} · ${esc(EB.dungeonOf(run).name)}</span>
          <span class="small">Floors cleared</span><span class="you">${(run.dungeon || 0) * run.map.floors.length + Math.max(0, run.floor + (won ? 1 : 0))} / ${EB.DUNGEONS.length * run.map.floors.length}</span>
          <span class="small">Battles won / lost</span><span class="you">${s.battlesWon} / ${s.battlesLost}</span>
          <span class="small">Lines cleared</span><span class="you">${s.lines}</span>
          <span class="small">Attack sent</span><span class="you">${s.sent}</span>

        </div></div>
        <div class="cards">${run.deck.map((c) => cardHTML(c, { small: true })).join('')}</div>
        <div class="row center mt"><button class="btn" data-act="menu">Menu</button><button class="btn primary" data-act="again">New Run</button></div>
      </div>`, {
        menu() { save().setRun(null); UI.title(); },
        again() { save().setRun(null); UI.newRun(); },
      });
    },

    // ================= DECK =================
    deck(back) {
      const run = save().run;
      const cards = run ? run.deck : EB.STARTER_DECK.map((id) => ({ id, lvl: 1, uid: id }));
      const shapes = {}, els = {}, rar = {};
      for (const c of cards) {
        const d = EB.CARDS[c.id];
        shapes[d.shape] = (shapes[d.shape] || 0) + 1;
        els[d.element] = (els[d.element] || 0) + 1;
        rar[d.rarity] = (rar[d.rarity] || 0) + 1;
      }
      const n = cards.length;
      const bars = (obj, keys, colorOf, labelOf) => keys.map((k) => `<div class="row" style="gap:8px;margin:4px 0"><span class="tiny" style="width:92px">${labelOf(k)}</span><div class="bar grow"><i style="width:${Math.round(((obj[k] || 0) / n) * 100)}%;background:${colorOf(k)}"></i></div><span class="tiny" style="width:22px;text-align:right">${obj[k] || 0}</span></div>`).join('');
      const sorted = cards.slice().sort((a, b) => {
        const A = EB.CARDS[a.id], B = EB.CARDS[b.id];
        return (A.element > B.element ? 1 : A.element < B.element ? -1 : 0) || EB.RARITY_ORDER.indexOf(B.rarity) - EB.RARITY_ORDER.indexOf(A.rarity);
      });
      UI.show(`<div class="wrap">
        <div class="row spread"><h2>${run ? 'Your Deck' : 'Starter Deck'} (${n})</h2><button class="btn sm" data-act="back">Back</button></div>
        ${run ? '' : '<p class="small dim">No run in progress. This is the deck every run starts with.</p>'}
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
          <div class="panel"><h3>Shapes</h3>${bars(shapes, EB.SHAPE_KEYS, () => '#a7b0c2', (k) => k + '-Block')}</div>
          <div class="panel"><h3>Elements</h3>${bars(els, ['neutral'].concat(EB.ELEMENT_IDS), (k) => EB.ELEMENTS[k].color, (k) => EB.ELEMENTS[k].name)}</div>
          <div class="panel"><h3>Rarity</h3>${bars(rar, EB.RARITY_ORDER, (k) => EB.RARITIES[k].color, (k) => EB.RARITIES[k].name)}</div>
        </div>
        ${run && Object.values(run.blessings).some((v) => v) ? `<div class="panel small">Blessings (starting energy): ${EB.ELEMENT_IDS.filter((e) => run.blessings[e]).map((e) => `${ico(e, 32).replace('<img', '<img width="14" height="14"')} ${EB.ELEMENTS[e].name} +${run.blessings[e]}`).join(' · ')}</div>` : ''}

        <div class="cards mt">${sorted.map((c) => cardHTML(c, { small: true })).join('')}</div>
      </div>`, { back: () => (back || UI.title)() });
    },
