:root {
  --bg: #0b0d1a;
  --bg2: #111530;
  --panel: #141833;
  --panel2: #1b2045;
  --edge: #2a3160;
  --edgeL: #3d4790;
  --text: #e8ecf4;
  --dim: #8a93b8;
  --you: #59d6ff;
  --foe: #ff5a7a;
  --gold: #ffd35c;
  --danger: #ff3355;
  --fire: #ff6a2a;
  --water: #3fa2ff;
  --nature: #5fd24a;
  --lightning: #ffe14a;
  --neutral: #a7b0c2;
  --common: #b8c0cc;
  --uncommon: #5fd24a;
  --rare: #3fa2ff;
  --epic: #c070ff;
  --legendary: #ffb02a;
  --px: 4px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: 'Press Start 2P', monospace; font-size: 12px; line-height: 1.6;
  -webkit-font-smoothing: none; overflow: hidden; touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}
img, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
button { font-family: inherit; }
.hidden { display: none !important; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; }

/* ---------- screens ---------- */
.screen {
  flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(89,214,255,0.12), transparent 60%),
    radial-gradient(ellipse at 50% 110%, rgba(255,90,122,0.12), transparent 60%),
    var(--bg);
}
.wrap { max-width: 980px; margin: 0 auto; }
h1, h2, h3 { margin: 0 0 12px; font-weight: normal; letter-spacing: 1px; }
h1 { font-size: 22px; }
h2 { font-size: 16px; color: var(--gold); text-shadow: 2px 2px 0 #000; }
h3 { font-size: 12px; color: var(--dim); }
p { margin: 0 0 10px; }
.dim { color: var(--dim); }
.small { font-size: 9px; line-height: 1.7; }
.tiny { font-size: 8px; line-height: 1.6; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.center { text-align: center; justify-content: center; }
.grid { display: grid; gap: 12px; }
.mt { margin-top: 14px; }
.mb { margin-bottom: 14px; }

/* pixel panel: stepped border with box-shadow */
.panel {
  background: var(--panel);
  box-shadow:
    0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge),
    inset 4px 4px 0 0 var(--panel2), 8px 8px 0 0 rgba(0,0,0,0.45);
  padding: 14px; margin: 4px 4px 16px;
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 12px; color: var(--text); background: #2a3160; border: 0; cursor: pointer;
  padding: 12px 18px; margin: 4px; position: relative; min-height: 44px;
  box-shadow:
    0 -4px 0 0 #0a0c18, 0 4px 0 0 #0a0c18, -4px 0 0 0 #0a0c18, 4px 0 0 0 #0a0c18,
    inset -4px -4px 0 0 #1a1f45, inset 4px 4px 0 0 #4a56a8;
  text-shadow: 2px 2px 0 #000; transition: transform 0.05s;
}
.btn:hover { background: #3a4590; }
.btn:active, .btn.on { transform: translateY(2px); box-shadow: 0 -4px 0 0 #0a0c18, 0 4px 0 0 #0a0c18, -4px 0 0 0 #0a0c18, 4px 0 0 0 #0a0c18, inset 4px 4px 0 0 #1a1f45; }
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 6px; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: #c24a1a; box-shadow: 0 -4px 0 0 #0a0c18, 0 4px 0 0 #0a0c18, -4px 0 0 0 #0a0c18, 4px 0 0 0 #0a0c18, inset -4px -4px 0 0 #7a2a0a, inset 4px 4px 0 0 #ff8a3d; }
.btn.primary:hover { background: #e0582a; }
.btn.good { background: #2a8a3a; box-shadow: 0 -4px 0 0 #0a0c18, 0 4px 0 0 #0a0c18, -4px 0 0 0 #0a0c18, 4px 0 0 0 #0a0c18, inset -4px -4px 0 0 #155a20, inset 4px 4px 0 0 #6fd06a; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--dim); }
.btn.ghost:hover { color: var(--text); }
.btn.sm { font-size: 9px; padding: 8px 10px; min-height: 32px; }
.btn.wide { width: 100%; }
.btn img { width: 16px; height: 16px; }
.btn.sel { background: #5a3ab0; }

.icon-btn {
  width: 40px; height: 40px; border: 0; cursor: pointer; background: rgba(20,24,51,0.85) center/20px no-repeat;
  box-shadow: 0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge);
}

/* ---------- title ---------- */
.title-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; position: relative; }
#titleBg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.5; z-index: 0; }
.title-screen > *:not(canvas) { position: relative; z-index: 1; }
.logo { text-align: center; margin: 10px 0 26px; }
.logo .l1, .logo .l2 { display: block; font-size: clamp(24px, 6vw, 52px); line-height: 1.15; letter-spacing: 2px; }
.logo .l1 { color: #fff; text-shadow: 4px 4px 0 #ff6a2a, 8px 8px 0 #3a0a0a; }
.logo .l2 { color: #59d6ff; text-shadow: 4px 4px 0 #2f3fa0, 8px 8px 0 #0a0c30; margin-top: 10px; }
.logo .tag { display: block; color: var(--dim); font-size: 10px; margin-top: 22px; }
.menu { display: flex; flex-direction: column; gap: 6px; width: min(340px, 90vw); }
.menu .btn { width: 100%; }
.el-strip { display: flex; gap: 14px; justify-content: center; margin: 4px 0 18px; }
.el-strip img { width: 28px; height: 28px; animation: bob 1.6s ease-in-out infinite; }
.el-strip img:nth-child(2) { animation-delay: 0.2s; } .el-strip img:nth-child(3) { animation-delay: 0.4s; } .el-strip img:nth-child(4) { animation-delay: 0.6s; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.footer-note { color: var(--dim); font-size: 8px; margin-top: 18px; text-align: center; }

/* ---------- cards ---------- */
.cards { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
.card {
  --c: var(--neutral); --r: var(--common);
  width: 150px; min-height: 206px; background: linear-gradient(180deg, #1b2045, #10132a);
  position: relative; padding: 8px; cursor: default; display: flex; flex-direction: column; gap: 4px;
  box-shadow:
    0 -4px 0 0 var(--r), 0 4px 0 0 var(--r), -4px 0 0 0 var(--r), 4px 0 0 0 var(--r),
    inset 0 0 0 2px #05060c, 6px 8px 0 0 rgba(0,0,0,0.5);
  margin: 4px;
}
.card.el-fire { --c: var(--fire); } .card.el-water { --c: var(--water); } .card.el-nature { --c: var(--nature); } .card.el-lightning { --c: var(--lightning); }
.card.r-uncommon { --r: var(--uncommon); } .card.r-rare { --r: var(--rare); } .card.r-epic { --r: var(--epic); } .card.r-legendary { --r: var(--legendary); }
.card.r-legendary { animation: legend 2s linear infinite; }
@keyframes legend { 50% { filter: brightness(1.25); } }
.card .top { display: flex; align-items: center; gap: 6px; }
.card .top img { width: 16px; height: 16px; flex: none; }
.card .name { font-size: 9px; line-height: 1.4; color: #fff; }
.card .art { height: 72px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, color-mix(in srgb, var(--c) 30%, transparent), transparent 70%), #0a0c18; box-shadow: inset 0 0 0 2px #05060c; }
.card .art img { max-width: 90%; max-height: 64px; }

  <script>/* js/core/util.js */
// Spellbricks — shared namespace + small helpers.
// Every file attaches to the global EB object so the game runs from file:// with no build step.
(function (EB) {
  'use strict';

  // Seeded RNG (mulberry32) so runs and AI can be reproduced.
  class RNG {
    constructor(seed) { this.s = (seed >>> 0) || 1; }
    next() {
      let t = (this.s += 0x6D2B79F5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    int(n) { return Math.floor(this.next() * n); }
    range(a, b) { return a + this.int(b - a + 1); }
    chance(p) { return this.next() < p; }
    pick(arr) { return arr[this.int(arr.length)]; }
    shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = this.int(i + 1);
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }
    weighted(items, wf) {
      let total = 0;
      for (const it of items) total += wf(it);
      let r = this.next() * total;
      for (const it of items) { r -= wf(it); if (r <= 0) return it; }
      return items[items.length - 1];
    }
  }

  EB.RNG = RNG;
  EB.newSeed = () => (Math.random() * 0xffffffff) >>> 0;

  EB.util = {
    clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    fmtTime(sec) {
      sec = Math.max(0, Math.ceil(sec));
      const m = Math.floor(sec / 60), s = sec % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    },
    hexToRgb(h) {
      h = h.replace('#', '');
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    },
    rgbToHex(r, g, b) {
      const c = (v) => EB.util.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0');
      return '#' + c(r) + c(g) + c(b);
    },
    shade(hex, f) { // f>0 lighten toward white, f<0 darken toward black
      const [r, g, b] = EB.util.hexToRgb(hex);

      return EB.util.rgbToHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);

// The seven tetromino shapes with SRS rotation states and wall kicks.
// Coordinates are in logical board space: y grows from the spawn edge toward the floor
// (the floor is always the side nearest the centre battle line).
(function (EB) {
  'use strict';

  const BASE = {
    I: { n: 4, cells: [[0, 1], [1, 1], [2, 1], [3, 1]] },
    O: { n: 2, cells: [[0, 0], [1, 0], [0, 1], [1, 1]] },
    T: { n: 3, cells: [[1, 0], [0, 1], [1, 1], [2, 1]] },
    L: { n: 3, cells: [[2, 0], [0, 1], [1, 1], [2, 1]] },
    J: { n: 3, cells: [[0, 0], [0, 1], [1, 1], [2, 1]] },
    S: { n: 3, cells: [[1, 0], [2, 0], [0, 1], [1, 1]] },
    Z: { n: 3, cells: [[0, 0], [1, 0], [1, 1], [2, 1]] },
  };

  // SRS kick data (from the guideline, y-up) converted to our y-down space.
  const JLSTZ = {
    '01': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
    '10': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
    '12': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
    '21': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
    '23': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
    '32': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
    '30': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
    '03': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
  };
  const I_KICKS = {
    '01': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
    '10': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
    '12': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
    '21': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
    '23': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
    '32': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
    '30': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
    '03': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
  };
  const flipY = (tbl) => {
    const o = {};
    for (const k in tbl) o[k] = tbl[k].map(([x, y]) => [x, -y]);
    return o;
  };
  const KICKS_JLSTZ = flipY(JLSTZ);
  const KICKS_I = flipY(I_KICKS);

  const SHAPES = {};
  for (const key in BASE) {
    const { n, cells } = BASE[key];
    const rots = [cells];
    for (let r = 1; r < 4; r++) {
      const prev = rots[r - 1];
      rots.push(key === 'O' ? prev : prev.map(([x, y]) => [n - 1 - y, x]));
    }
    SHAPES[key] = {
      key, n, rots,
      // centred for any board width (10 cols: I/T/L/J/S/Z at 3, O at 4)
      get spawnX() { return Math.floor((EB.CONFIG.COLS - n) / 2); },
      spawnY: 0,
      kicks: key === 'I' ? KICKS_I : key === 'O' ? null : KICKS_JLSTZ,
    };
  }

  EB.SHAPES = SHAPES;
  EB.SHAPE_KEYS = Object.keys(SHAPES);
})(globalThis.EB = globalThis.EB || {});

// Relics: passive items for the whole run. Hooks (all optional):
//   onBattleStart(f, st)   onLock(ctx, st)   onClear(ctx, st)   onReaction(ctx, st)
//   onReceive(f, lines, st) -> lines        onTick(f, dt, st)
//   afterBattle(run, result)                 mods: { reactionCd, hpDamage, gold }
// `st` is a per-battle scratch object for that relic.
(function (EB) {
  'use strict';
  const R = {};
  const add = (id, o) => { R[id] = Object.assign({ id }, o); };

  add('flame_core', {
    name: 'Flame Core', icon: 'fire', rarity: 'rare',
    desc: 'Fire cards that clear lines deal +1 attack.',
    onClear(ctx) { if (ctx.cardEl === 'fire') ctx.addAttack(1); },
  });
  add('ocean_heart', {
    name: 'Ocean Heart', icon: 'water', rarity: 'rare',
    desc: 'The first garbage attack you receive each battle is reduced by 3.',
    onBattleStart(f, st) { st.used = false; },
    onReceive(f, lines, st) { if (!st.used) { st.used = true; f.popup('OCEAN HEART', '#3fa2ff'); return Math.max(0, lines - 3); } return lines; },

    name: 'Thunder Ring', icon: 'lightning', rarity: 'rare',

// Map events. Each option: { label, desc, can(run)?, run(run, api) -> result text }.
// `api` is provided by run.js (grant card, upgrade picker, etc).
(function (EB) {
  'use strict';
  EB.EVENTS = [
    {
      id: 'shrine', title: 'Elemental Shrine', icon: 'gem',
      text: 'Four braziers flicker around a cracked altar. Each one hums with a different element.',
      options: EB.ELEMENT_IDS.map((el) => ({
        label: `Pray to ${EB.ELEMENTS[el].name}`,
        desc: `Lose 6 HP. Gain a random Rare+ ${EB.ELEMENTS[el].name} card.`,
        can: (run) => run.hp > 6,
        run(run, api) {
          run.hp -= 6;
          const c = api.randomCard({ element: el, minRarity: 'rare' });
          api.addCard(c);
          return `The ${EB.ELEMENTS[el].name} brazier roars. You gain ${EB.CARDS[c].name}.`;
        },
      })).concat([{ label: 'Leave', desc: 'Walk away.', run: () => 'You leave the shrine in peace.' }]),
    },
    {
      id: 'merchant', title: 'Wandering Merchant', icon: 'coin',
      text: 'A hooded figure opens a coat lined with glowing trinkets. "Blood or gold, friend?"',
      options: [
        { label: 'Trade 10 HP', desc: 'Lose 10 HP. Gain a random relic.', can: (run) => run.hp > 10,
          run(run, api) { run.hp -= 10; const r = api.randomRelic(); if (!r) return 'He has nothing left you lack.'; api.addRelic(r); return `You gain ${EB.RELICS[r].name}.`; } },
        { label: 'Pay 60 gold', desc: 'Upgrade 2 random cards.', can: (run) => run.gold >= 60,
          run(run, api) { run.gold -= 60; const n = api.upgradeRandom(2); return n ? `${n} card(s) shimmer with new power.` : 'Nothing could be upgraded.'; } },
        { label: 'Leave', desc: 'Keep walking.', run: () => 'The merchant shrugs and vanishes into fog.' },
      ],
    },
    {

// Board Manager — pure logic, no rendering.
// Logical orientation for BOTH sides: row 0 = spawn edge (outer edge, danger line side),
// row ROWS-1 = floor (the edge touching the centre battle line). The renderer flips the
// AI board so its spawn edge is at the bottom of the screen.
(function (EB) {
  'use strict';

  class Board {
    constructor(cols, rows) {
      this.cols = cols;
      this.rows = rows;
      this.grid = [];
      for (let r = 0; r < rows; r++) this.grid.push(new Array(cols).fill(null));
    }

    get(x, y) { return y < 0 ? null : this.grid[y][x]; }

    fits(shape, rot, x, y) {
      const cells = EB.SHAPES[shape].rots[rot];
      for (let i = 0; i < 4; i++) {
        const cx = x + cells[i][0], cy = y + cells[i][1];
        if (cx < 0 || cx >= this.cols || cy >= this.rows) return false;
        if (cy >= 0 && this.grid[cy][cx]) return false;
      }
      return true;
    }

    // Place a piece. Returns false if any block ended up above the board.
    lock(shape, rot, x, y, meta) {
      const cells = EB.SHAPES[shape].rots[rot];
      let ok = true;
      for (const [dx, dy] of cells) {
        const cx = x + dx, cy = y + dy;
        if (cy < 0) { ok = false; continue; }
        this.grid[cy][cx] = { el: meta.el, shape, kind: 'block' };
      }
      return ok;
    }

    fullRows() {
      const out = [];
      for (let r = 0; r < this.rows; r++) if (this.grid[r].every((c) => c)) out.push(r);
      return out;
    }

    // Remove rows; returns the cells that were cleared (for element energy / fx).
    clearRows(rows) {
      const cleared = [];
      const set = new Set(rows);
      const keep = [];
      for (let r = 0; r < this.rows; r++) {
        if (set.has(r)) cleared.push(...this.grid[r]);
        else keep.push(this.grid[r]);
      }
      while (keep.length < this.rows) keep.unshift(new Array(this.cols).fill(null));
      this.grid = keep;
      return cleared;
    }

    // Push garbage in from the floor (centre side). holes: array of hole columns, one per row.
    // Returns true if blocks were pushed off the spawn edge (overflow).
    addGarbage(holes) {
      let overflow = false;
      for (const h of holes) {
        const top = this.grid.shift();
        if (top.some((c) => c)) overflow = true;
        const row = new Array(this.cols).fill(null).map((_, i) => (i === h ? null : { el: 'garbage', kind: 'garbage' }));
        this.grid.push(row);
      }
      return overflow;
    }

    // remove the n rows nearest the floor, whatever is in them (hero skills)
    removeBottomRows(n) {
      let removed = 0;
      while (removed < n && this.grid[this.rows - 1].some((c) => c)) {
        this.grid.pop();
        this.grid.unshift(new Array(this.cols).fill(null));
        removed++;
      }
      return removed;
    }

    // Remove up to n rows that contain garbage, nearest the floor first. Returns rows removed.
    removeGarbageRows(n) {
      let removed = 0;
      for (let r = this.rows - 1; r >= 0 && removed < n; r--) {
        if (this.grid[r].some((c) => c && c.kind === 'garbage')) {
          this.grid.splice(r, 1);
          this.grid.unshift(new Array(this.cols).fill(null));
          removed++;
          r++; // re-check the same index (rows shifted down)
        }
      }
      return removed;
    }

    garbageRowCount() {
      let n = 0;
      for (const row of this.grid) if (row.some((c) => c && c.kind === 'garbage')) n++;
      return n;
    }

    stackHeight() {
      for (let r = 0; r < this.rows; r++) if (this.grid[r].some((c) => c)) return this.rows - r;
      return 0;
    }

    inDanger(dangerRows) {
      for (let r = 0; r < dangerRows; r++) if (this.grid[r].some((c) => c)) return true;
      return false;
    }

    isEmpty() { return this.grid.every((row) => row.every((c) => !c)); }

    // Compact bit representation for the AI (bit x set = filled).
    toMasks() {
      const m = new Array(this.rows);
      for (let r = 0; r < this.rows; r++) {
        let v = 0;
        const row = this.grid[r];
        for (let c = 0; c < this.cols; c++) if (row[c]) v |= 1 << c;
        m[r] = v;
      }
      return m;
    }
  }

  EB.Board = Board;
})(globalThis.EB = globalThis.EB || {});

// Card and Deck System for one battle: draw pile -> preview queue -> active -> discard.
// When the draw pile runs out, the discard pile is shuffled into a new draw pile.
(function (EB) {
  'use strict';

  class BattleDeck {
    constructor(cards, rng, preview) {
      this.rng = rng;
      this.preview = preview || EB.CONFIG.PREVIEW;
      this.all = cards.map((c) => Object.assign({}, c));
      this.draw = rng.shuffle(this.all.slice());
      this.discard = [];
      this.queue = [];
      this.active = null;
      this.hold = null;
      this.shuffles = 0;
      this.fill();
    }

    drawOne() {
      if (!this.draw.length) {
        if (!this.discard.length) return null;
        this.draw = this.rng.shuffle(this.discard);
        this.discard = [];
        this.shuffles++;
      }
      return this.draw.pop();
    }

    fill() {
      while (this.queue.length < this.preview) {
        const c = this.drawOne();
        if (!c) break;
        this.queue.push(c);
      }
    }

    // Take the next card into play.
    next() {
      this.fill();
      this.active = this.queue.shift() || null;
      this.fill();
      return this.active;
    }

    // Active card was placed: send it to the discard pile.
    spend() {
      if (this.active) this.discard.push(this.active);
      this.active = null;
    }

    // Swap the active card with the held card (or stash it and draw).
    swapHold() {
      const cur = this.active;
      if (this.hold) {
        this.active = this.hold;
        this.hold = cur;
      } else {
        this.hold = cur;
        this.next();
      }
      return this.active;
    }

    counts() {
      return { draw: this.draw.length, discard: this.discard.length, total: this.all.length };
    }
  }

  EB.BattleDeck = BattleDeck;
})(globalThis.EB = globalThis.EB || {});

// Elemental System: energy, bursts, auras and reactions. Works for any element listed in
// EB.ELEMENT_IDS, so new elements only need data.
(function (EB) {
  'use strict';
  const CFG = () => EB.CONFIG;

  EB.Elemental = {
    // aura lasts longer on wide boards (a line takes more blocks): 6s at 10 columns, 12s at 20+
    auraTime() { return CFG().AURA_TIME * Math.min(2, Math.max(1, CFG().COLS / 10)); },

    // the reaction two elements make together, or null
    reactionFor(a, b) {
      if (!a || !b || a === b) return null;
      return EB.REACTIONS.find((r) => r.els.includes(a) && r.els.includes(b)) || null;
    },

    // what clearing with this card would trigger right now (aura active and cooldown over)
    pending(f, card) {
      if (!card || !f.aura || f.aura.until <= f.battle.time || f.reactionReadyAt > f.battle.time) return null;
      return EB.Elemental.reactionFor(f.aura.el, EB.CARDS[card.id].element);
    },

    emptyEnergy() {
      const e = {};
      for (const el of EB.ELEMENT_IDS) e[el] = 0;
      return e;
    },

    add(f, el, n) {
      if (!el || !(el in f.energy) || n <= 0) return;
      if (f.hero && f.hero.noElements) return;
      f.energy[el] = Math.min(CFG().ENERGY_MAX, f.energy[el] + n);
    },

    // Fire every full meter. Called during lock resolution with the same ctx.
    bursts(f, ctx) {
      for (const el of EB.ELEMENT_IDS) {
        if (f.energy[el] >= CFG().ENERGY_MAX) {
          f.energy[el] = 0;
          const b = EB.ELEMENTS[el].burst;
          b.apply(ctx);
          f.stats.bursts++;
          f.battle.emit('burst', { side: f.side, el, name: b.name });
        }
      }
    },

    // els: elements of this clear (the card placed). The aura of the previous elemental clear is added.
    reaction(f, ctx, els) {
      if (f.hero && f.hero.noElements) return null;
      const t = f.battle.time;
      if (f.aura && f.aura.until > t) els.add(f.aura.el);
      let fired = null;
      if (t >= f.reactionReadyAt) {
        for (const r of EB.REACTIONS) {
          if (els.has(r.els[0]) && els.has(r.els[1])) { fired = r; break; }
        }
      }
      if (fired) {
        fired.apply(ctx);
        for (const id of f.relics) {
          const rel = EB.RELICS[id];
          if (rel && rel.onReaction) rel.onReaction(ctx, f.relicState[id]);
        }
        let cd = CFG().REACTION_COOLDOWN;
        for (const id of f.relics) { const m = EB.RELICS[id] && EB.RELICS[id].mods; if (m && m.reactionCd) cd *= m.reactionCd; }
        f.reactionReadyAt = t + cd;
        f.aura = null;
        f.stats.reactions++;
        f.battle.emit('reaction', { side: f.side, id: fired.id, name: fired.name, color: fired.color });
      } else if (ctx.cardEl !== 'neutral') {
        const dur = EB.Elemental.auraTime();
        f.aura = { el: ctx.cardEl, until: t + dur, dur };
      }
      return fired;
    },
  };
})(globalThis.EB = globalThis.EB || {});

// One side of the battle: board + deck + active piece + attack/garbage/combo/elements.
// The player and the AI use this exact class, so the AI follows the same rules.
(function (EB) {
  'use strict';
  const C = () => EB.CONFIG;

  class Fighter {
    constructor(battle, o) {
      this.battle = battle;
      this.side = o.side;               // 'top' (player) or 'bottom' (AI)
      this.name = o.name;
      this.isAI = !!o.isAI;
      this.portrait = o.portrait || null;
      this.rng = new EB.RNG(o.seed);
      this.board = new EB.Board(C().COLS, C().ROWS);
      this.deck = new EB.BattleDeck(o.cards, this.rng, C().PREVIEW);
      // a hero brings a passive (a hidden relic) and an active skill charged by clearing lines
      this.hero = o.hero && EB.HEROES && EB.HEROES[o.hero] ? EB.HEROES[o.hero] : null;
      this.relics = (o.relics || []).concat(this.hero ? ['hero:' + this.hero.id] : []).filter((id) => EB.RELICS[id]);
      this.skillCharge = 0;
      this.relicState = {};
      for (const id of this.relics) this.relicState[id] = {};

      this.piece = null;
      this.holdUsed = false;
      this.softDrop = false;
      this.gravAcc = 0; this.lockTimer = 0; this.lockResets = 0; this.lowestY = 0;
      this.spawnTime = 0;

      this.incoming = [];      // [{lines, hole, readyAt}]
      this.lastHole = -1;
      this.shield = 0;
      this.combo = 0; this.comboGuard = false; this.lastQuad = false;
      this.rapidStreak = 0;
      this.storedBonus = 0;
      this.energy = EB.Elemental.emptyEnergy();
      this.aura = null;
      this.reactionReadyAt = 0;
      this.fogUntil = 0;
      this.chargedUntil = 0;
      this.dead = false; this.deathReason = '';
      this.lastClearRows = [];

      this.stats = {
        pieces: 0, lines: 0, sent: 0, attack: 0, received: 0, cancelled: 0, absorbed: 0,
        maxCombo: 0, actions: 0, reactions: 0, bursts: 0, quads: 0, clears: [0, 0, 0, 0, 0],
      };
      if (o.energy) for (const el in o.energy) EB.Elemental.add(this, el, o.energy[el]);
    }

    get opp() { return this.side === 'top' ? this.battle.ai : this.battle.player; }
    emit(type, data) { this.battle.emit(type, Object.assign({ side: this.side }, data || {})); }
    popup(text, color, big) { this.emit('popup', { text, color, big }); }

    startBattle() {
      for (const id of this.relics) {
        const r = EB.RELICS[id];
        if (r.onBattleStart) r.onBattleStart(this, this.relicState[id]);
      }
      for (const el of EB.ELEMENT_IDS) this.energy[el] = Math.min(this.energy[el], C().ENERGY_MAX - 1);
      this.spawn();
    }

    // ---------------- pieces ----------------
    setPiece(card) {
      const def = EB.CARDS[card.id];
      const sh = EB.SHAPES[def.shape];
      this.piece = { card, shape: def.shape, el: def.element, rot: 0, x: sh.spawnX, y: sh.spawnY };
      this.gravAcc = 0; this.lockTimer = 0; this.lockResets = 0; this.lowestY = this.piece.y;
      if (!this.board.fits(this.piece.shape, 0, this.piece.x, this.piece.y)) {
        // try one row higher (into the hidden buffer) before topping out
        if (this.board.fits(this.piece.shape, 0, this.piece.x, this.piece.y - 1)) this.piece.y -= 1;
        else { this.die('blocked'); return false; }
      }
      return true;
    }

    spawn() {
      if (this.dead) return;
      const card = this.deck.next();
      if (!card) { this.die('empty deck'); return; }
      this.holdUsed = false;
      this.spawnTime = this.battle.time;
      if (this.setPiece(card)) this.emit('spawn', {});
    }

    fits(dx, dy, rot) {
      const p = this.piece;
      return this.board.fits(p.shape, rot === undefined ? p.rot : rot, p.x + dx, p.y + dy);
    }

    onGround() { return this.piece && !this.fits(0, 1); }

    touchLock() {
      if (this.onGround() && this.lockResets < C().LOCK_RESETS) { this.lockTimer = 0; this.lockResets++; }
    }

    move(dx) {
      if (!this.canAct()) return false;
      if (!this.fits(dx, 0)) return false;

      this.stats.actions++;
      this.touchLock();
      this.emit('move', {});
      return true;
    }

    rotate(dir) {
      if (!this.canAct()) return false;
      const p = this.piece;
      const sh = EB.SHAPES[p.shape];
      const to = (p.rot + (dir > 0 ? 1 : 3)) % 4;
      if (!sh.kicks) { this.stats.actions++; this.emit('rotate', {}); return true; } // O
      const kicks = sh.kicks['' + p.rot + to];

    }

      this.skillCharge = 0;
      this.hero.skill.use(this);
      this.emit('skill', { name: this.hero.skill.name, el: this.hero.element });
      // the board may have changed under the falling block
      if (this.piece) while (!this.fits(0, 0) && this.piece.y > -2) this.piece.y--;
      return true;
    }

    canAct() { return !this.dead && this.piece && this.battle.state !== 'over' && this.battle.started; }

    // ---------------- per-frame ----------------
    update(dt) {
      for (const id of this.relics) {
        const r = EB.RELICS[id];
        if (r.onTick) r.onTick(this, dt, this.relicState[id]);
      }
      if (this.dead || !this.piece) return;
      let g = this.battle.gravityInterval();
      if (this.hastedUntil > this.battle.time) g /= 2; // hit by Raiden's Haste
      const interval = this.softDrop ? Math.min(g, C().SOFT_DROP_INTERVAL) : g;
      if (this.fits(0, 1)) {
        this.lockTimer = 0;
        this.gravAcc += dt;
        while (this.gravAcc >= interval) {
          this.gravAcc -= interval;
          if (this.fits(0, 1)) {
            this.piece.y++;
            if (this.softDrop) this.emit('softdrop', {});
            if (this.piece.y > this.lowestY) { this.lowestY = this.piece.y; this.lockResets = 0; }
          } else { this.gravAcc = 0; break; }
        }
      } else {
        this.gravAcc = 0;
        this.lockTimer += dt;
        if (this.lockTimer >= C().LOCK_DELAY || (this.softDrop && this.lockTimer >= C().LOCK_DELAY * 0.5)) this.lock();
      }
    }

    // ---------------- context for card / relic / element effects ----------------
    makeCtx(card, extra) {
      const f = this;
      const def = EB.CARDS[card.id];
      const ctx = Object.assign({
        f, opp: f.opp, card, def, cardEl: def.element, lvl: card.lvl || 1,
        lines: 0, rapid: false, rapidStreak: f.rapidStreak, combo: f.combo, baseAttack: 0, attack: 0,
        addAttack(n) { if (n > 0) ctx.attack += n; },
        cancel(n) { return f.cancelIncoming(n); },
        shield(n) { f.addShield(n); },
        removeGarbage(n) { const r = f.board.removeGarbageRows(n); if (r) { f.emit('purify', { n: r }); f.popup('-' + r + ' GARBAGE', '#8be05a'); } return r; },
        energy(el, n) { EB.Elemental.add(f, el, n); },
        comboAdd(n) { f.combo += n; ctx.combo = f.combo; },
        guardCombo() { f.comboGuard = true; },
        fogOpponent(s) { const o = f.opp; if (o) f.battle.affect(o, 'fog', s); },
        charge(s) { f.chargedUntil = f.battle.time + s; f.popup('CHARGED', '#ffe14a'); },
        shake(p) { f.battle.emit('shake', { side: f.opp ? f.opp.side : f.side, power: p }); },
        storeBonus(n, max) { f.storedBonus = Math.min(max, f.storedBonus + n); },
      }, extra || {});
      return ctx;
    }

    relicHook(name, ctx) {
      for (const id of this.relics) {
        const r = EB.RELICS[id];
        if (r[name]) r[name](ctx, this.relicState[id]);
      }
    }

    // ---------------- lock & resolve ----------------
    lock() {
      if (!this.piece || this.dead) return;
      const p = this.piece;
      const card = p.card;
      const def = EB.CARDS[card.id];
      const t = this.battle.time;
      const placedCells = EB.SHAPES[p.shape].rots[p.rot].map(([dx, dy]) => [p.x + dx, p.y + dy]);
      const ok = this.board.lock(p.shape, p.rot, p.x, p.y, { el: def.element });

      this.deck.spend();

      this.stats.pieces++;

      this.rapidStreak = rapid ? this.rapidStreak + 1 : 0;
      this.emit('lock', { cells: placedCells, el: def.element, shape: p.shape });

      const n = rows.length;
      let cleared = [];
      if (n) {
        this.lastClearRows = rows.slice();
        // remember the cells for fx before removal
        const fxRows = rows.map((r) => ({ r, cells: this.board.grid[r].map((c) => (c ? c.el : null)) }));
        cleared = this.board.clearRows(rows);
        this.emit('clear', { rows: fxRows, n });
      }

      const ctx = this.makeCtx(card, { lines: n, rapid, rapidStreak: this.rapidStreak });
      if (def.element !== 'neutral') EB.Elemental.add(this, def.element, C().ENERGY_PER_PLACE);

        this.combo++;

        for (const c of cleared) if (c && c.el in this.energy) counts[c.el] = (counts[c.el] || 0) + 1;
        for (const el in counts) EB.Elemental.add(this, el, counts[el] * C().ENERGY_PER_CELL);

        if (def.onClear) def.onClear(ctx);
        this.relicHook('onClear', ctx);
        EB.Elemental.reaction(this, ctx, els);

        let extra = 0;
        const combo = this.combo;
        const cb = C().COMBO_BONUS[Math.min(combo, C().COMBO_BONUS.length - 1)];
        extra += cb;
        if (n >= 4) {
          this.stats.quads++;
          if (this.lastQuad) { extra += C().B2B_BONUS; this.popup('BACK-TO-BACK', '#ffd35c'); }
          this.lastQuad = true;
        } else this.lastQuad = false;
        if (this.board.isEmpty()) { extra += C().ALL_CLEAR_BONUS; this.popup('ALL CLEAR!', '#ffffff', true); }
        if (this.chargedUntil > t) extra += 1;
        if (this.storedBonus) { extra += this.storedBonus; this.storedBonus = 0; }
        total = base + extra;

        const names = ['', 'SINGLE', 'DOUBLE', 'TRIPLE', 'QUAD!'];
        this.popup(names[Math.min(4, n)], n >= 4 ? '#ffe14a' : '#ffffff', n >= 4);
        if (combo >= 2) { this.popup('COMBO x' + combo, combo >= 4 ? '#ff6a2a' : '#ffd35c', combo >= 4); this.emit('combo', { combo }); }
        this.stats.maxCombo = Math.max(this.stats.maxCombo, combo);
      } else {
        if (this.comboGuard && this.combo > 0) { this.comboGuard = false; this.popup('COMBO KEPT', '#c6ff4a'); }
        else this.combo = 0;
      }

      EB.Elemental.bursts(this, ctx);
      total += ctx.attack;
      if (total > 0) {
        this.stats.attack += total;
        const cancelled = C().GARBAGE_MODE === 'direct' ? 0 : this.cancelIncoming(total);
        const rem = total - cancelled;
        if (rem > 0) this.battle.sendAttack(this, rem, def.element);

      if (n === 0) this.applyGarbage();
      if (this.board.inDanger(C().DANGER_ROWS)) { this.die('danger'); return; }
      this.spawn();
    }

    // ---------------- garbage ----------------
    pendingLines() { let s = 0; for (const g of this.incoming) s += g.lines; return s; }
    readyLines() { const t = this.battle.time; let s = 0; for (const g of this.incoming) if (g.readyAt <= t) s += g.lines; return s; }

    receive(lines, el) {
      for (const id of this.relics) {
        const r = EB.RELICS[id];
        if (r.onReceive) lines = r.onReceive(this, lines, this.relicState[id]);
      }
      if (this.shield > 0 && lines > 0) {
        const a = Math.min(this.shield, lines);
        this.shield -= a; lines -= a;
        this.stats.absorbed += a;
        this.emit('absorb', { n: a });
        this.popup('BLOCKED ' + a, '#6fc3ff');
      }
      if (lines <= 0) return;
      let hole = this.rng.int(C().COLS);
      if (hole === this.lastHole) hole = (hole + 1 + this.rng.int(C().COLS - 1)) % C().COLS;
      this.lastHole = hole;
      this.incoming.push({ lines, hole, readyAt: this.battle.time + C().GARBAGE_DELAY, el });
      this.emit('incoming', { lines });
    }

    cancelIncoming(n) {
      let c = 0;
      while (n > 0 && this.incoming.length) {
        const g = this.incoming[0];
        const k = Math.min(n, g.lines);
        g.lines -= k; n -= k; c += k;
        if (g.lines <= 0) this.incoming.shift();
      }
      if (c) { this.stats.cancelled += c; this.emit('cancel', { n: c }); this.popup('COUNTER ' + c, '#6fc3ff'); }

    }

    addShield(n) {
      this.shield = Math.min(8, this.shield + n);
      this.emit('shield', { n });
    }

    applyGarbage(force) {
      const t = this.battle.time;
      let cap = C().GARBAGE_CAP_PER_LOCK;
      const holes = [];
      while (cap > 0 && this.incoming.length && (force || this.incoming[0].readyAt <= t)) {
        const g = this.incoming[0];
        const k = Math.min(cap, g.lines);
        for (let i = 0; i < k; i++) {
          if (i > 0 && this.rng.chance(C().GARBAGE_MESSINESS)) g.hole = (g.hole + 1 + this.rng.int(C().COLS - 1)) % C().COLS;
          holes.push(g.hole);

      if (!holes.length) return;

      this.stats.received += holes.length;
      this.emit('garbage', { n: holes.length });

        // keep the active piece clear of the risen stack
        while (!this.fits(0, 0) && this.piece.y > -2) this.piece.y--;
      }
      if (overflow || this.board.inDanger(C().DANGER_ROWS)) this.die('danger');
    }

    die(reason) {
      if (this.dead) return;
      this.dead = true;
      this.deathReason = reason;
      this.piece = null;
      this.emit('topout', { reason });

// AI System. The AI controls its Fighter only through the same actions a human has
// (rotate, move, hold, hard drop) with human-like delays. It sees only its own board,
// its own active/held card and its own preview queue — no hidden advantages.
(function (EB) {
  'use strict';
  const C = () => EB.CONFIG;

  // ---- bit-mask board helpers ----
  function fitsM(m, cols, rows, shape, rot, x, y) {
    const cells = EB.SHAPES[shape].rots[rot];
    for (let i = 0; i < 4; i++) {
      const cx = x + cells[i][0], cy = y + cells[i][1];
      if (cx < 0 || cx >= cols || cy >= rows) return false;
      if (cy >= 0 && (m[cy] >> cx) & 1) return false;
    }
    return true;
  }

  function rotateM(m, cols, rows, shape, st, dir) {
    const sh = EB.SHAPES[shape];
    if (!sh.kicks) return { rot: st.rot, x: st.x, y: st.y };
    const to = (st.rot + (dir > 0 ? 1 : 3)) % 4;
    for (const [kx, ky] of sh.kicks['' + st.rot + to]) {
      if (fitsM(m, cols, rows, shape, to, st.x + kx, st.y + ky)) return { rot: to, x: st.x + kx, y: st.y + ky };
    }
    return null;
  }

  // Every placement reachable by: rotate (shortest way), slide, hard drop.
  function placements(m, cols, rows, shape, start) {
    const out = [];
    const seen = new Set();
    const seqs = shape === 'O' ? [[]] : [[], [1], [1, 1], [-1]];
    for (const seq of seqs) {
      let st = { rot: start.rot, x: start.x, y: start.y };
      for (const d of seq) { st = st && rotateM(m, cols, rows, shape, st, d); }
      if (!st) continue;
      for (const dir of [-1, 1]) {
        let x = st.x;
        while (true) {
          if (!fitsM(m, cols, rows, shape, st.rot, x, st.y)) break;
          let y = st.y;
          while (fitsM(m, cols, rows, shape, st.rot, x, y + 1)) y++;
          const key = st.rot + ':' + x;
          if (!seen.has(key)) { seen.add(key); out.push({ rot: st.rot, x, y }); }
          x += dir;
        }
      }
    }
    return out;
  }

  function place(m, cols, rows, shape, rot, x, y) {
    const nm = m.slice();
    let above = false;
    for (const [dx, dy] of EB.SHAPES[shape].rots[rot]) {
      const cy = y + dy;
      if (cy < 0) { above = true; continue; }
      nm[cy] |= 1 << (x + dx);
    }
    const full = (1 << cols) - 1;
    const kept = nm.filter((r) => r !== full);
    const lines = rows - kept.length;
    while (kept.length < rows) kept.unshift(0);
    return { m: kept, lines, above, landing: rows - y };
  }

  // Board quality. Higher is better.
  function evalBoard(m, cols, rows) {
    const h = new Array(cols).fill(0);
    let holes = 0, covered = 0;
    for (let c = 0; c < cols; c++) {
      let seen = false, blocksAbove = 0;
      for (let r = 0; r < rows; r++) {
        const filled = (m[r] >> c) & 1;
        if (filled) { if (!seen) { h[c] = rows - r; seen = true; } blocksAbove++; }
        else if (seen) { holes++; covered += Math.min(blocksAbove, 4); }
      }
    }
    let agg = 0, bump = 0, maxH = 0;
    for (let c = 0; c < cols; c++) { agg += h[c]; maxH = Math.max(maxH, h[c]); if (c) bump += Math.abs(h[c] - h[c - 1]); }
    // row transitions (roughness inside rows)
    let rowT = 0;
    for (let r = 0; r < rows; r++) {
      if (!m[r]) continue;
      let prev = 1;
      for (let c = 0; c < cols; c++) { const b = (m[r] >> c) & 1; if (b !== prev) rowT++; prev = b; }
      if (prev !== 1) rowT++;
    }
    // wells deeper than 2 (except one is fine for I pieces)
    let wells = 0, deepest = 0;
    for (let c = 0; c < cols; c++) {
      const l = c ? h[c - 1] : 99, r = c < cols - 1 ? h[c + 1] : 99;

  class AIController {
    constructor(fighter, level, speed) {

      this.L = level;
      this.speed = speed || 1;
      this.rng = new EB.RNG(fighter.rng.int(1e9) + 7);

    thinkTime() {

      if (f.fogUntil > f.battle.time) t *= 1.6;
      if (f.pendingLines() > 0) t *= 0.8; // pressure sharpens focus

    update(dt) {
      const f = this.f;
      if (!f.canAct()) { this.plan = null; this.pieceRef = null; f.softDrop = false; return; }
      if (f.piece !== this.pieceRef) {
        this.pieceRef = f.piece;
        if (!this.plan || !this.plan.afterHold) { this.plan = null; this.timer = this.thinkTime(); }
        else { this.plan = null; this.timer = this.L.step / this.speed; }
      }
      this.timer -= dt;
      if (this.timer > 0) return;
      const step = this.L.step / this.speed * (0.8 + this.rng.next() * 0.4);

      if (!this.plan) {
        this.plan = this.decide();
        if (this.plan.hold) {
          this.plan.afterHold = true;
          if (!f.hold()) this.plan = null;
          this.timer = step;
          return;
        }
        this.timer = step * 0.5;
        return;
      }
      const p = f.piece, plan = this.plan;
      if (p.rot !== plan.rot) {
        const d = ((plan.rot - p.rot + 4) % 4) === 3 ? -1 : 1;
        if (!f.rotate(d)) plan.rot = p.rot;
        this.timer = step;
        return;
      }
      if (p.x !== plan.x) {
        if (!f.move(plan.x > p.x ? 1 : -1)) plan.x = p.x;
        this.timer = step;
        return;
      }
      if (!plan.waited) { plan.waited = true; this.timer = this.L.dropWait / this.speed; return; }
      f.hardDrop();
    }

    // Value of clearing lines right now, given the situation.
    clearValue(lines, card, f, maxH) {
      if (!lines) return 0;
      const L = this.L;
      const atk = EB.attackFor(lines);
      let v = lines * 1.2 + atk * 1.4 * L.attackBias;
      if (f.pendingLines() > 0) v += Math.min(lines * 1.5, f.pendingLines() * 1.5) * Math.max(0.5, L.attackBias); // counter
      if (f.combo > 0) v += 0.8 * L.attackBias;
      if (card) {
        const def = EB.CARDS[card.id];
        if (def.onClear) v += 1.2 * L.attackBias;
      }
      if (maxH > 10) v += lines * 2; // survival first
      // a skilled AI saves single clears when the board is low and safe
      if (L.lookahead && lines === 1 && maxH < 7 && f.pendingLines() === 0) v -= 1.5;
      return v;
    }

    bestFor(m, card, start, f, depthCards) {
      const cols = C().COLS, rows = C().ROWS;
      const shape = EB.CARDS[card.id].shape;
      const list = [];
      for (const pl of placements(m, cols, rows, shape, start)) {
        const res = place(m, cols, rows, shape, pl.rot, pl.x, pl.y);
        if (res.above) continue;
        const ev = evalBoard(res.m, cols, rows);
        let s = ev.s + this.clearValue(res.lines, card, f, ev.maxH) - res.landing * 0.12;
        list.push({ rot: pl.rot, x: pl.x, s, m: res.m, lines: res.lines });
      }
      list.sort((a, b) => b.s - a.s);
      if (depthCards && depthCards.length && list.length) {
        const next = depthCards[0];
        const ns = EB.SHAPES[EB.CARDS[next.id].shape];
        const top = list.slice(0, 6);
        for (const c of top) {
          const inner = this.bestFor(c.m, next, { rot: 0, x: ns.spawnX, y: ns.spawnY }, f, null);
          const best = inner.length ? inner[0].s : -999;
          c.s = this.clearValue(c.lines, card, f, 0) * 0.9 + best;
        }
        top.sort((a, b) => b.s - a.s);
        return top.concat(list.slice(6));
      }
      return list;
    }

    decide() {
      const f = this.f, L = this.L;
      const m = f.board.toMasks();
      const fog = f.fogUntil > f.battle.time;
      const look = L.lookahead && !fog ? f.deck.queue.slice(0, 1) : null;
      const p = f.piece;
      let list = this.bestFor(m, p.card, { rot: p.rot, x: p.x, y: p.y }, f, look);
      for (const c of list) c.s += (this.rng.next() - 0.5) * L.noise * 4;
      list.sort((a, b) => b.s - a.s);
      let choice = list[0];
      if (list.length > 1 && this.rng.chance(L.mistake)) choice = list[1 + this.rng.int(Math.min(4, list.length - 1))];

      if (L.hold && !f.holdUsed) {
        const alt = f.deck.hold || f.deck.queue[0];
        if (alt) {
          const sh = EB.SHAPES[EB.CARDS[alt.id].shape];
          const altList = this.bestFor(m, alt, { rot: 0, x: sh.spawnX, y: Math.max(0, p.y) }, f, null);
          if (altList.length && (!choice || altList[0].s > choice.s + 1.5)) return { hold: true };
        }
      }
      if (!choice) return { rot: p.rot, x: p.x };
      return { rot: choice.rot, x: choice.x };
    }
  }

  EB.AIController = AIController;
  EB.AIUtil = { placements, place, evalBoard, fitsM };

// Game Manager for one match: two Fighters, the timer, attacks in flight and win rules.
(function (EB) {
  'use strict';
  const C = () => EB.CONFIG;

  class Battle {
    constructor(o) {
      this.o = o;
      this.rng = new EB.RNG(o.seed || EB.newSeed());
      this.time = 0;
      this.started = false;
      this.state = 'countdown';
      this.countdown = C().COUNTDOWN;
      this.timeLeft = C().MATCH_TIME;
      this.sudden = false;
      this.listeners = [];
      this.projectiles = [];
      this.result = null;
      this.player = new EB.Fighter(this, Object.assign({ side: 'top', seed: this.rng.int(1e9) }, o.player));
      this.ai = new EB.Fighter(this, Object.assign({ side: 'bottom', seed: this.rng.int(1e9), isAI: !o.online }, o.enemy));
      // Play a Friend: the bottom board is a puppet drawn from the friend's snapshots (EB.Net);
      // attacks, effects and events go over the network instead of into it.
      this.online = o.online || null;
      if (this.online) { this.ai.remote = true; return; }
      const lvl = EB.AI_LEVELS[EB.util.clamp(o.enemy.level || 0, 0, EB.AI_LEVELS.length - 1)];
      this.aiCtrl = new EB.AIController(this.ai, lvl, o.enemy.speed || 1);
      // optional: let the AI also drive the player (used by automated tests / attract mode)
      if (o.autoPlayer) this.playerCtrl = new EB.AIController(this.player, EB.AI_LEVELS[o.autoPlayer.level], o.autoPlayer.speed || 1);
    }

    on(fn) { this.listeners.push(fn); }
    emit(type, data) {
      for (const fn of this.listeners) fn(type, data || {});
      if (this.online && data && data.side === 'top' && !data.remote) this.online.event(type, data);
      if (type === 'clear' && this.state === 'sudden') {
        this.end(data.side === 'top' ? 'player' : 'ai', 'Sudden death: first line clear');
      }
    }

    fighter(side) { return side === 'top' ? this.player : this.ai; }

    gravityInterval() {
      const scale = C().GRAVITY_REF_ROWS / C().ROWS;
      if (this.sudden) return C().GRAVITY_SUDDEN * scale;
      // gravity speeds up across the match (over 2 minutes when there is no time limit)
      const ramp = isFinite(C().MATCH_TIME) ? C().MATCH_TIME : 120;
      const t = EB.util.clamp(this.time / ramp, 0, 1);
      return EB.util.lerp(C().GRAVITY_START, C().GRAVITY_END, t) * scale;
    }

    sendAttack(from, lines, el) {
      const to = from === this.player ? this.ai : this.player;
      from.stats.sent += lines;
      const fromRows = from.lastClearRows.length ? from.lastClearRows : [C().ROWS - 1];
      this.projectiles.push({
        from: from.side, to: to.side, lines, el, t: 0, dur: C().PROJECTILE_TIME,
        row: fromRows[Math.floor(fromRows.length / 2)],
      });
      this.emit('attack', { side: from.side, lines, el });
      if (this.online && from === this.player) this.online.send({ t: 'atk', lines, el, row: this.projectiles[this.projectiles.length - 1].row });
    }

    // an attack the friend sent: it flies across, then lands on our board
    remoteAttack(lines, el, row) {
      if (this.state === 'over') return;
      lines = Math.max(0, Math.min(20, lines | 0));
      if (!lines) return;
      this.ai.stats.sent += lines;
      this.projectiles.push({ from: 'bottom', to: 'top', lines, el, t: 0, dur: C().PROJECTILE_TIME, row: row == null ? C().ROWS - 1 : row });
      this.emit('attack', { side: 'bottom', lines, el, remote: true });
    }

    // effects that land on the other fighter (fog, haste): sent over the network in Play a Friend
    affect(target, kind, secs) {
      if (this.online && target === this.ai) { this.online.send({ t: 'fx', kind, secs }); return; }
      if (kind === 'fog') { target.fogUntil = this.time + secs; this.emit('fog', { side: target.side, remote: true }); }
      if (kind === 'haste') target.hastedUntil = this.time + secs;
    }

    update(dt) {
      if (this.state === 'over') { this.time += dt; return; }
      if (this.state === 'countdown') {
        const before = Math.ceil(this.countdown);
        this.countdown -= dt;
        const after = Math.ceil(this.countdown);
        if (after !== before && after > 0) this.emit('tick', { n: after });
        if (this.countdown <= 0) {
          this.state = 'playing';
          this.started = true;
          this.player.startBattle();
          this.ai.startBattle();
          this.emit('go', {});
        }
        return;
      }
      this.time += dt;
      this.timeLeft -= dt;
      this.player.update(dt);
      if (!this.online) { this.ai.update(dt); this.aiCtrl.update(dt); }
      if (this.playerCtrl) this.playerCtrl.update(dt);

      for (let i = this.projectiles.length - 1; i >= 0; i--) {
        const p = this.projectiles[i];
        p.t += dt;
        if (p.t >= p.dur) {
          this.projectiles.splice(i, 1);
          const target = this.fighter(p.to);
          if (target.remote) { this.emit('hit', { side: p.to, lines: p.lines, el: p.el }); continue; } // the friend's phone applies it
          target.receive(p.lines, p.el);
          // direct mode: garbage lands the moment the attack arrives (no queue, no counter)
          if (C().GARBAGE_MODE === 'direct') { let guard = 10; while (target.incoming.length && !target.dead && guard--) target.applyGarbage(true); }
          this.emit('hit', { side: p.to, lines: p.lines, el: p.el });
        }
      }
      if (this.state === 'over') return;
      const pd = this.player.dead, ad = this.ai.dead;
      if (pd || ad) {
        if (pd && ad) this.end('draw', 'Both stacks overflowed');
        else this.end(pd ? 'ai' : 'player', (pd ? 'Your' : this.online ? "Your friend's" : 'Enemy') + ' stack reached the danger line');
        return;
      }
      if (this.timeLeft <= 0) this.timeUp();
    }

    timeUp() {
      const hp = this.player.stackHeight(), ha = this.ai.stackHeight();
      if (hp !== ha) return this.end(hp < ha ? 'player' : 'ai', `Time! Lower stack wins (${hp} vs ${ha})`);
      const rp = this.player.stats.received, ra = this.ai.stats.received;
      if (rp !== ra) return this.end(rp < ra ? 'player' : 'ai', `Time! Same height — fewer garbage received wins (${rp} vs ${ra})`);
      const lp = this.player.stats.lines, la = this.ai.stats.lines;
      if (lp !== la) return this.end(lp > la ? 'player' : 'ai', `Time! Tie — more lines cleared wins (${lp} vs ${la})`);
      if (!this.sudden) {
        this.sudden = true;
        this.state = 'sudden';
        this.timeLeft = C().SUDDEN_DEATH_TIME;
        this.emit('sudden', {});
        return;
      }
      this.end('draw', 'Sudden death ended in a perfect tie');
    }

    end(winner, reason) {
      if (this.state === 'over') return;
      this.state = 'over';
      this.result = {
        winner, reason,
        duration: this.time,
        mode: this.o.mode,
        player: Object.assign({ height: this.player.stackHeight() }, this.player.stats),
        ai: Object.assign({ height: this.ai.stackHeight() }, this.ai.stats),
      };
      this.emit('end', this.result);
    }
  }

  EB.Battle = Battle;
})(globalThis.EB = globalThis.EB || {});

  <script>/* js/systems/run.js */
// Roguelike Progression + Reward System. A run is a plain JSON object (easy to save).
(function (EB) {
  'use strict';
  const C = () => EB.CONFIG;

  const FLOOR_TYPES = [
    ['battle'],
    ['battle', 'event', 'shop'],
    ['elite', 'upgrade', 'battle'],
    ['battle', 'rest', 'event'],
    ['battle', 'elite', 'shop'],
    ['event', 'battle', 'upgrade'],
    ['rest', 'shop'],
    ['boss'],
  ];
  const FLOOR_COUNTS = [2, 3, 3, 3, 3, 3, 2, 1];

  EB.NODE_TYPES = {
    battle: { name: 'Battle', icon: 'sword', color: '#d9dde6', desc: 'Fight a wandering foe.' },
    elite: { name: 'Elite', icon: 'skull', color: '#ff6a5a', desc: 'A tough foe with a relic. Better rewards.' },
    event: { name: 'Event', icon: 'question', color: '#c070ff', desc: 'Something strange happens.' },
    shop: { name: 'Shop', icon: 'coin', color: '#ffd35c', desc: 'Buy cards and relics, remove cards.' },
    upgrade: { name: 'Forge', icon: 'hammer', color: '#ff9a3c', desc: 'Upgrade a card for free.' },
    rest: { name: 'Rest Site', icon: 'campfire', color: '#5fd24a', desc: 'Heal or upgrade a card.' },
    boss: { name: 'Boss', icon: 'crown', color: '#ffb02a', desc: 'The guardian of this dungeon.' },
  };

  function rngOf(run) {
    const r = new EB.RNG(1);
    r.s = run.rngState >>> 0;
    return r;
  }
  function saveRng(run, r) { run.rngState = r.s >>> 0; }

  function genMap(rng, dungeon) {
    const pools = (EB.DUNGEONS[dungeon || 0] || EB.DUNGEONS[0]).pools;
    const floors = [];
    const usedEnemies = new Set();
    const pickEnemy = (tier) => {
      const pool = pools[tier].filter((e) => !usedEnemies.has(e));
      const e = rng.pick(pool.length ? pool : pools[tier]);
      usedEnemies.add(e);
      if (usedEnemies.size >= pools.normal.length) usedEnemies.clear();
      return e;
    };
    for (let f = 0; f < FLOOR_TYPES.length; f++) {
      const n = FLOOR_COUNTS[f];
      let types = rng.shuffle(FLOOR_TYPES[f].slice());
      while (types.length < n) types.push(rng.pick(FLOOR_TYPES[f]));
      types = types.slice(0, n);
      const row = [];
      for (let i = 0; i < n; i++) {
        const type = types[i];
        const node = { idx: i, floor: f, type, x: (i + 0.5) / n, next: [] };
        if (type === 'battle') node.enemy = pickEnemy('normal');
        if (type === 'elite') node.enemy = pickEnemy('elite');
        if (type === 'boss') node.enemy = pickEnemy('boss');
        row.push(node);
      }
      floors.push(row);
    }
    // connect floors by lane proximity
    for (let f = 0; f < floors.length - 1; f++) {
      const a = floors[f], b = floors[f + 1];
      for (const node of a) {
        let best = 0, bd = 9;
        b.forEach((m, j) => { const d = Math.abs(m.x - node.x); if (d < bd) { bd = d; best = j; } });
        node.next.push(best);
        const side = best + (rng.chance(0.5) ? 1 : -1);
        if (side >= 0 && side < b.length && rng.chance(0.55)) node.next.push(side);
      }
      b.forEach((m, j) => {
        if (!a.some((p) => p.next.includes(j))) {
          let best = a[0], bd = 9;
          for (const p of a) { const d = Math.abs(p.x - m.x); if (d < bd) { bd = d; best = p; } }
          best.next.push(j);
        }
      });
      for (const node of a) node.next = [...new Set(node.next)].sort();
    }
    return { floors };
  }

  const Run = {
    create({ difficulty, seed, hero }) {
      seed = seed || EB.newSeed();
      const rng = new EB.RNG(seed);
      const run = {
        v: 1, seed, difficulty: difficulty == null ? 1 : difficulty,
        hp: C().RUN_HP, maxHp: C().RUN_HP, gold: 60,
        hero: hero && EB.HEROES && EB.HEROES[hero] ? hero : null,
        deck: (hero && EB.HEROES && EB.HEROES[hero] ? EB.HEROES[hero].deck : EB.STARTER_DECK).map((id) => EB.makeCard(id)),
        relics: [], blessings: EB.Elemental.emptyEnergy(),
        dungeon: 0, map: genMap(rng, 0), floor: -1, nodeIdx: null, path: [],
        status: 'map', removals: 0, startedAt: Date.now(),
        stats: { battlesWon: 0, battlesLost: 0, lines: 0, sent: 0, bestCombo: 0, pieces: 0, reactions: 0 },
        rngState: 0,
      };
      saveRng(run, rng);
      return run;
    },

    rng: rngOf,
    saveRng,

    currentNode(run) { return run.floor < 0 ? null : run.map.floors[run.floor][run.nodeIdx]; },

    // nodes the player may enter next
    choices(run) {
      if (run.floor < 0) return run.map.floors[0].map((n) => n.idx);
      const cur = Run.currentNode(run);
      return cur ? cur.next.slice() : [];
    },

    enter(run, idx) {
      run.floor += 1;
      run.nodeIdx = idx;
      run.path.push([run.floor, idx]);
      run.nodeDone = false;
    },

    // AI tier & speed for an enemy on this floor, scaled by run difficulty and dungeon.
    enemyFor(run, node) {
      const def = EB.ENEMIES[node.enemy];
      const D = EB.dungeonOf(run);
      const d = run.difficulty, tier = def.tier, f = node.floor;
      let level = def.level, speed = 1;
      // the dungeon sets a minimum tier for normal foes and elites (Dungeon 1 adds nothing)
      if (tier === 'normal') level = Math.max(level, D.normalLevel);
      if (tier === 'elite') level = Math.max(level, D.eliteLevel);
      if (d === 0) { level = Math.max(0, level - 1); speed = tier === 'boss' ? 1 : 0.9; if (tier === 'boss') level = 1; }
      if (d === 1) { if (tier === 'normal' && (f >= 3 || level >= 1)) { level = Math.max(level, 1); speed = 0.85; } if (tier === 'boss') speed = 0.9; }
      if (d === 2) { level = Math.min(2, level + 1); speed = f >= 3 ? 1.1 : 0.95; }
      if (tier === 'boss') speed *= C().BOSS_SPEED;
      speed *= D.speed;
      return { id: node.enemy, def, level: Math.min(2, level), speed, tier };
    },

    lastDungeon(run) { return (run.dungeon || 0) >= EB.DUNGEONS.length - 1; },

    // boss beaten: heal half of the missing HP and move to a fresh map in the next dungeon
    nextDungeon(run) {
      const rng = rngOf(run);
      run.dungeon = (run.dungeon || 0) + 1;
      run.map = genMap(rng, run.dungeon);
      run.floor = -1; run.nodeIdx = null; run.path = []; run.nodeDone = false;
      run.status = 'map';
      saveRng(run, rng);
    },
    dungeonHeal(run) { return Math.ceil((run.maxHp - run.hp) * 0.5); },
    dungeonRelics(run) {
      const rng = rngOf(run);
      const pool = rng.shuffle(EB.RELIC_IDS.filter((id) => !run.relics.includes(id)));
      saveRng(run, rng);
      return pool.slice(0, 3);
    },

    // shift: later dungeons (EB.DUNGEONS[].rarity) move rewards toward rarer cards
    rarityFor(rng, tier, shift) {
      const k = shift || 0;
      const w = tier === 'boss' ? { common: 0, uncommon: 10 - 3 * k, rare: 50, epic: 30 + 5 * k, legendary: 12 + 4 * k }
        : tier === 'elite' ? { common: 10 - 4 * k, uncommon: 40 - 8 * k, rare: 35 + 4 * k, epic: 12 + 5 * k, legendary: 3 + 2 * k }
          : { common: 45 - 15 * k, uncommon: 36 - 4 * k, rare: 15 + 8 * k, epic: 3 + 4 * k, legendary: 0.6 + 0.8 * k };
      return rng.weighted(EB.RARITY_ORDER, (r) => Math.max(0, w[r])); // later dungeons push some weights below 0
    },

    randomCard(rng, opt) {
      opt = opt || {};
      const minI = opt.minRarity ? EB.RARITY_ORDER.indexOf(opt.minRarity) : 0;
      let rarity = opt.rarity || Run.rarityFor(rng, opt.tier || 'normal', opt.shift);
      if (EB.RARITY_ORDER.indexOf(rarity) < minI) rarity = EB.RARITY_ORDER[minI];
      let pool = EB.CARD_IDS.filter((id) => {
        const c = EB.CARDS[id];
        return c.element !== 'neutral' && c.rarity === rarity && (!opt.element || c.element === opt.element) && !(opt.exclude || []).includes(id);
      });
      if (!pool.length) pool = EB.CARD_IDS.filter((id) => EB.CARDS[id].element !== 'neutral' && (!opt.element || EB.CARDS[id].element === opt.element) && EB.RARITY_ORDER.indexOf(EB.CARDS[id].rarity) >= minI);
      return rng.pick(pool);
    },

    randomRelic(run, rng) {
      const pool = EB.RELIC_IDS.filter((id) => !run.relics.includes(id));
      return pool.length ? rng.pick(pool) : null;
    },

    upgradable(run) { return run.deck.filter((c) => (c.lvl || 1) < (EB.CARDS[c.id].maxLvl || 2)); },

    // ---- rewards ----
    rewards(run, tier) {
      const rng = rngOf(run);
      const out = [];
      const used = new Set();
      const cardOpt = () => {
        const id = Run.randomCard(rng, { tier, shift: EB.dungeonOf(run).rarity, exclude: out.filter((o) => o.type === 'card').map((o) => o.cardId) });
        return { type: 'card', cardId: id };
      };
      out.push(cardOpt());
      if (tier !== 'normal') { const r = Run.randomRelic(run, rng); if (r) { out.push({ type: 'relic', relicId: r }); used.add('relic'); } }
      const pool = [
        { t: 'card', w: 3 },
        { t: 'upgrade', w: Run.upgradable(run).length ? 2.2 : 0 },
        { t: 'remove', w: run.deck.length > C().MIN_DECK ? 1.6 : 0 },
        { t: 'relic', w: 0.7 },
        { t: 'gold', w: 1.4 },
        { t: 'heal', w: run.hp < run.maxHp * 0.8 ? 1.8 : 0.3 },
        { t: 'blessing', w: 1.2 },
      ];
      let guard = 0;
      while (out.length < 3 && guard++ < 50) {
        const p = rng.weighted(pool, (x) => (used.has(x.t) && x.t !== 'card' ? 0 : x.w));
        if (p.t === 'card') { if (out.filter((o) => o.type === 'card').length >= 2) continue; out.push(cardOpt()); continue; }
        used.add(p.t);
        if (p.t === 'relic') { const r = Run.randomRelic(run, rng); if (r) out.push({ type: 'relic', relicId: r }); }
        else if (p.t === 'gold') out.push({ type: 'gold', amount: rng.range(35, 60) });
        else if (p.t === 'heal') out.push({ type: 'heal', amount: 15 });
        else if (p.t === 'blessing') out.push({ type: 'blessing', el: rng.pick(EB.ELEMENT_IDS), amount: 25 });
        else out.push({ type: p.t });
      }
      saveRng(run, rng);
      return out;
    },

    describeReward(r) {
      switch (r.type) {
        case 'card': { const c = EB.CARDS[r.cardId]; return { title: 'New Card', name: c.name, desc: `Add ${c.name} (${EB.RARITIES[c.rarity].name} ${EB.ELEMENTS[c.element].name}) to your deck.` }; }
        case 'relic': { const x = EB.RELICS[r.relicId]; return { title: 'Relic', name: x.name, desc: x.desc }; }
        case 'gold': return { title: 'Gold', name: `+${r.amount} Gold`, desc: 'Spend it in shops.' };
        case 'heal': return { title: 'Restore', name: `Heal ${r.amount} HP`, desc: 'Patch yourself up.' };
        case 'upgrade': return { title: 'Upgrade', name: 'Upgrade a Card', desc: 'Choose a card and improve its ability.' };
        case 'remove': return { title: 'Remove', name: 'Remove a Card', desc: 'Thin your deck so your best cards come more often.' };
        case 'blessing': return { title: 'Elemental Bonus', name: `${EB.ELEMENTS[r.el].name} Blessing`, desc: `Start every battle with +${r.amount} ${EB.ELEMENTS[r.el].name} energy.` };
      }
      return { title: '?', name: '?', desc: '' };
    },

    // apply instant rewards; upgrade/remove need a card pick (handled by the UI)
    applyReward(run, r) {
      if (r.type === 'card') run.deck.push(EB.makeCard(r.cardId));
      if (r.type === 'relic') run.relics.push(r.relicId);
      if (r.type === 'gold') run.gold += r.amount;
      if (r.type === 'heal') run.hp = Math.min(run.maxHp, run.hp + r.amount);
      if (r.type === 'blessing') run.blessings[r.el] = Math.min(75, (run.blessings[r.el] || 0) + r.amount);
    },

    upgradeCard(run, uid) {
      const c = run.deck.find((x) => x.uid === uid);
      if (c && (c.lvl || 1) < (EB.CARDS[c.id].maxLvl || 2)) { c.lvl = (c.lvl || 1) + 1; return true; }
      return false;
    },
    removeCard(run, uid) {
      if (run.deck.length <= C().MIN_DECK) return false;
      const i = run.deck.findIndex((x) => x.uid === uid);
      if (i < 0) return false;
      run.deck.splice(i, 1);
      return true;
    },

    relicMod(run, key, def) {
      let v = def;
      for (const id of run.relics) {
        const m = EB.RELICS[id] && EB.RELICS[id].mods;
        if (m && m[key] != null) v = key === 'gold' ? v + m[key] : v * m[key];
      }
      return v;
    },

    // returns {damage, gold}
    afterBattle(run, result, tier) {
      const rng = rngOf(run);
      const win = result.winner === 'player';
      let damage, gold = 0;
      if (win) {
        damage = Math.ceil(result.player.received / C().WIN_DAMAGE_DIV);
        const [a, b] = C().GOLD_REWARD[tier];
        gold = Math.round(Run.relicMod(run, 'gold', rng.range(a, b) * EB.dungeonOf(run).gold));
        run.gold += gold;
        run.stats.battlesWon++;
      } else {
        damage = result.winner === 'draw' ? Math.ceil(C().LOSS_DAMAGE[tier] / 2) : C().LOSS_DAMAGE[tier];
        run.stats.battlesLost++;
      }
      damage = Math.round(damage * Run.relicMod(run, 'hpDamage', 1));
      run.hp -= damage;
      for (const id of run.relics) { const r = EB.RELICS[id]; if (r.afterBattle) r.afterBattle(run, result); }
      run.stats.lines += result.player.lines;
      run.stats.sent += result.player.sent;
      run.stats.pieces += result.player.pieces;
      run.stats.reactions += result.player.reactions;
      run.stats.bestCombo = Math.max(run.stats.bestCombo, result.player.maxCombo);
      if (run.hp <= 0) { run.hp = 0; run.status = 'lost'; }
      saveRng(run, rng);
      return { damage, gold, win };
    },

    // ---- shop ----
    shop(run, node) {
      if (node.shop) return node.shop;
      const rng = rngOf(run);
      const cards = [];
      for (let i = 0; i < 5; i++) {
        const id = Run.randomCard(rng, { tier: i >= 3 ? 'elite' : 'normal', shift: EB.dungeonOf(run).rarity, exclude: cards.map((c) => c.cardId) });
        const base = EB.RARITIES[EB.CARDS[id].rarity].price;
        cards.push({ cardId: id, price: Math.round(base * (0.9 + rng.next() * 0.2)), sold: false });
      }
      const relics = [];
      for (let i = 0; i < 2; i++) {
        const pool = EB.RELIC_IDS.filter((id) => !run.relics.includes(id) && !relics.some((r) => r.relicId === id));
        if (pool.length) relics.push({ relicId: rng.pick(pool), price: rng.range(140, 185), sold: false });
      }
      node.shop = { cards, relics, removePrice: 75 + 25 * run.removals, removed: false, heal: { amount: 15, price: 35, sold: false } };
      saveRng(run, rng);
      return node.shop;
    },

    pickEvent(run, node) {
      if (node.event) return EB.EVENTS.find((e) => e.id === node.event);
      const rng = rngOf(run);
      run.seenEvents = run.seenEvents || [];
      let pool = EB.EVENTS.filter((e) => !run.seenEvents.includes(e.id));
      if (!pool.length) pool = EB.EVENTS;
      const ev = rng.pick(pool);
      node.event = ev.id;
      run.seenEvents.push(ev.id);
      saveRng(run, rng);
      return ev;
    },
  };

  EB.Run = Run;
})(globalThis.EB = globalThis.EB || {});

// Audio Manager: chiptune SFX and music synthesised with WebAudio (no audio files).
(function (EB) {
  'use strict';

  const NOTE = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };
  const midi = (n) => { const m = n.match(/^([A-G][#b]?)(\d)$/); return 12 * (+m[2] + 1) + NOTE[m[1]]; };
  const freq = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const seq = (s) => s.trim().split(/\s+/);

  const TRACKS = {
    menu: {
      bpm: 84, chords: [['A3', 'm'], ['F3', 'M'], ['C4', 'M'], ['G3', 'M']], drums: 'soft',
      lead: seq(`A4 - C5 - E5 - D5 C5  C5 - A4 - F4 - G4 A4  G4 - E4 - G4 - C5 -  B4 - D5 - G4 - - .
                 A4 - E5 - A5 - G5 E5  F5 - E5 - C5 - A4 -  G4 - C5 - E5 - D5 C5  B4 - G4 - B4 D5 - -`),
    },
    battle: {
      bpm: 140, chords: [['D3', 'm'], ['A#2', 'M'], ['C3', 'M'], ['A2', 'M']], drums: 'full',
      lead: seq(`D5 . F5 A5 - G5 F5 E5  D5 - . D5 F5 - D5 C5  E5 . G5 C6 - B5 G5 E5  C#5 - E5 - A4 - . .
                 A5 - G5 F5 E5 D5 E5 F5  D5 - A#4 - D5 F5 G5 F5  E5 - C5 - E5 G5 A5 G5  A5 - - - E5 - C#5 -`),
    },
    boss: {
      bpm: 152, chords: [['E3', 'm'], ['C3', 'M'], ['D3', 'M'], ['B2', 'M']], drums: 'full',
      lead: seq(`E5 . G5 B5 - A5 G5 F#5  E5 - . E5 G5 - E5 D5  F#5 . A5 D6 - C6 A5 F#5  D#5 - F#5 - B4 - . .
                 B5 - A5 G5 F#5 E5 F#5 G5  E5 - C5 - E5 G5 A5 G5  F#5 - D5 - F#5 A5 B5 A5  B5 - - - F#5 - D#5 -`),
    },
    victory: {
      bpm: 120, chords: [['C3', 'M'], ['G2', 'M'], ['A2', 'm'], ['F2', 'M']], drums: 'soft',
      lead: seq(`C5 E5 G5 C6 - - G5 -  B4 D5 G5 B5 - - G5 -  A4 C5 E5 A5 - - E5 -  F5 - A5 - C6 - - -`),
    },
  };

  class AudioMgr {
    constructor() {
      this.ctx = null;
      this.vol = { music: 0.5, sfx: 0.7 };
      this.track = null; this.wanted = null;
      this.step = 0; this.nextTime = 0; this.timer = null;
      this.last = {};
    }

    unlock() {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain(); this.musicGain.connect(this.master);
      this.sfxGain = this.ctx.createGain(); this.sfxGain.connect(this.master);
      const len = this.ctx.sampleRate;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.applyVolume();
      if (this.wanted) this.music(this.wanted, true);
    }

    setVolume(kind, v) { this.vol[kind] = v; this.applyVolume(); }
    applyVolume() {
      if (!this.ctx) return;
      this.musicGain.gain.value = this.vol.music * 0.32;
      this.sfxGain.gain.value = this.vol.sfx * 0.55;
    }

    // ---- primitives ----
    tone(type, f0, f1, dur, vol, when, dest) {
      const c = this.ctx; if (!c) return;
      const t = when || c.currentTime;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest || this.sfxGain);
      o.start(t); o.stop(t + dur + 0.02);
    }
    hiss(dur, vol, when, hp, dest, lp) {
      const c = this.ctx; if (!c) return;
      const t = when || c.currentTime;
      const s = c.createBufferSource(); s.buffer = this.noise;
      const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 800;
      const g = c.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f);
      let last = f;
      if (lp) { const l = c.createBiquadFilter(); l.type = 'lowpass'; l.frequency.value = lp; f.connect(l); last = l; }
      last.connect(g); g.connect(dest || this.sfxGain);
      s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
    }

    // ---- sound effects ----
    sfx(name, arg, quiet) {
      if (!this.ctx || this.vol.sfx <= 0) return;
      const now = this.ctx.currentTime;
      const k = quiet ? 0.35 : 1;
      // rate-limit very frequent sounds
      const gap = { move: 0.03, softdrop: 0.05, rotate: 0.03, lock: 0.04 }[name];
      if (gap) { if (this.last[name + k] && now - this.last[name + k] < gap) return; this.last[name + k] = now; }
      switch (name) {
        case 'move': this.tone('square', 260, 0, 0.035, 0.08 * k); break;
        case 'rotate': this.tone('square', 380, 520, 0.05, 0.08 * k); break;
        case 'softdrop': this.tone('triangle', 140, 0, 0.025, 0.08 * k); break;
        case 'harddrop': this.tone('sine', 140, 50, 0.14, 0.4 * k); this.hiss(0.08, 0.12 * k, now, 1500); break;
        case 'lock': this.tone('triangle', 180, 120, 0.06, 0.15 * k); break;
        case 'hold': this.tone('square', 300, 600, 0.08, 0.08 * k); break;
        case 'clear': {
          const n = arg || 1;
          const base = [72, 76, 79, 84];
          for (let i = 0; i < n + 1; i++) this.tone('square', freq(base[Math.min(i, 3)] + (n >= 4 ? 5 : 0)), 0, 0.09, 0.12 * k, now + i * 0.045);
          if (n >= 4) this.hiss(0.3, 0.12 * k, now, 3000);
          break;
        }
        case 'combo': this.tone('square', freq(76 + Math.min(arg || 2, 10) * 2), 0, 0.12, 0.12 * k, now + 0.12); break;
        case 'attack': this.tone('sawtooth', 220, 900, 0.22, 0.09 * k); this.hiss(0.18, 0.06 * k, now, 2500); break;
        case 'hit': this.tone('square', 110, 55, 0.2, 0.18 * k); this.hiss(0.2, 0.15 * k, now, 300, null, 2000); break;
        case 'garbage': this.tone('sawtooth', 90, 45, 0.25, 0.16 * k); break;
        case 'cancel': this.tone('sine', 900, 1400, 0.12, 0.14 * k); this.tone('sine', 1400, 1800, 0.1, 0.1 * k, now + 0.06); break;
        case 'shield': this.tone('sine', 600, 1200, 0.2, 0.14 * k); break;
        case 'purify': for (let i = 0; i < 3; i++) this.tone('triangle', freq(79 + i * 4), 0, 0.1, 0.13 * k, now + i * 0.05); break;
        case 'burst': {
          const el = arg;
          if (el === 'fire') { this.hiss(0.45, 0.3 * k, now, 200, null, 1800); this.tone('sawtooth', 120, 60, 0.4, 0.15 * k); }
          else if (el === 'water') { for (let i = 0; i < 5; i++) this.tone('sine', 300 + Math.random() * 500, 900, 0.07, 0.12 * k, now + i * 0.05); }
          else if (el === 'nature') { for (let i = 0; i < 4; i++) this.tone('triangle', freq(67 + [0, 4, 7, 12][i]), 0, 0.14, 0.14 * k, now + i * 0.06); }
          else { this.hiss(0.2, 0.25 * k, now, 4000); this.tone('square', 1200, 80, 0.25, 0.12 * k); }
          break;
        }
        case 'reaction': {
          [60, 64, 67, 72].forEach((m, i) => this.tone('square', freq(m + 7), 0, 0.35, 0.08 * k, now + i * 0.02));
          this.hiss(0.4, 0.2 * k, now, 600);
          this.tone('sine', 80, 40, 0.4, 0.3 * k);
          break;
        }
        case 'tick': this.tone('square', 520, 0, 0.1, 0.15); break;
        case 'go': this.tone('square', 1040, 0, 0.25, 0.16); this.tone('square', 780, 0, 0.25, 0.1); break;
        case 'danger': this.tone('sine', 70, 50, 0.12, 0.3); this.tone('sine', 70, 50, 0.12, 0.25, now + 0.18); break;
        case 'victory': [72, 76, 79, 84, 88].forEach((m, i) => this.tone('square', freq(m), 0, 0.2, 0.12, now + i * 0.1)); break;
        case 'defeat': [67, 63, 60, 55].forEach((m, i) => this.tone('triangle', freq(m), 0, 0.35, 0.18, now + i * 0.18)); break;
        case 'ui': this.tone('square', 660, 0, 0.04, 0.07); break;
        case 'buy': this.tone('square', 990, 0, 0.06, 0.1); this.tone('square', 1320, 0, 0.1, 0.1, now + 0.06); break;
        case 'sudden': this.tone('sawtooth', 200, 800, 0.5, 0.15); break;
      }
    }

    // ---- music sequencer ----
    music(name, force) {
      this.wanted = name;
      if (!this.ctx) return;
      if (this.track === name && !force) return;
      this.track = name;
      this.step = 0;
      this.nextTime = this.ctx.currentTime + 0.1;
      if (this.timer) clearInterval(this.timer);
      this.timer = null;
      if (!name) return;
      this.timer = setInterval(() => this.schedule(), 25);
    }

    schedule() {
      const tr = TRACKS[this.track];
      if (!tr || !this.ctx) return;
      const eighth = 60 / tr.bpm / 2;
      const dest = this.musicGain;
      while (this.nextTime < this.ctx.currentTime + 0.12) {
        const t = this.nextTime;
        const i = this.step % tr.lead.length;
        const bar = Math.floor(this.step / 8) % tr.chords.length;
        const inBar = this.step % 8;
        // lead
        const tok = tr.lead[i];
        if (tok !== '-' && tok !== '.') {
          let len = 1;
          while (tr.lead[(i + len) % tr.lead.length] === '-' && len < 8) len++;
          this.tone('square', freq(midi(tok)), 0, eighth * len * 0.9, 0.16, t, dest);
        }
        // bass + arp
        const [root, q] = tr.chords[bar];
        const r = midi(root);
        if (inBar % 2 === 0) this.tone('triangle', freq(inBar === 4 ? r + 12 : r), 0, eighth * 1.8, 0.32, t, dest);
        const third = q === 'm' ? 3 : 4;
        const arp = [0, third, 7, 12][inBar % 4] + 12;
        this.tone('square', freq(r + arp), 0, eighth * 0.45, 0.04, t, dest);
        this.tone('square', freq(r + arp), 0, eighth * 0.45, 0.025, t + eighth / 2, dest);
        // drums
        if (tr.drums === 'full') {
          if (inBar === 0 || inBar === 4 || inBar === 5) this.tone('sine', 150, 40, 0.12, 0.5, t, dest);
          if (inBar === 2 || inBar === 6) this.hiss(0.1, 0.18, t, 1200, dest);
          this.hiss(0.03, 0.06, t, 7000, dest);
          this.hiss(0.03, 0.04, t + eighth / 2, 7000, dest);
        } else {
          if (inBar === 0) this.tone('sine', 120, 40, 0.15, 0.35, t, dest);
          if (inBar % 2 === 1) this.hiss(0.03, 0.04, t, 7000, dest);
        }
        this.nextTime += eighth;
        this.step++;
      }
    }
  }

  EB.Audio = new AudioMgr();
})(globalThis.EB = globalThis.EB || {});
