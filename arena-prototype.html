<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d1a">
  <title>Spellbricks Arena</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    #arena { position: fixed; inset: 0; display: flex; flex-direction: column; background: #0b0d1a;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
    #stage { flex: 1; position: relative; min-height: 0; overflow: hidden; touch-action: none; }
    #stage canvas { position: absolute; left: 0; top: 0; }
    #pauseBtn { position: fixed; z-index: 3; width: 34px; height: 34px; background-size: 16px; }
    .seg { display: flex; flex-wrap: wrap; gap: 0; }
    .seg .btn { font-size: 9px; padding: 8px 10px; min-height: 34px; }
  </style>
</head>
<body>
  <div id="arena">
    <div id="stage"><canvas id="cv" aria-label="Battle arena"></canvas></div>
    <button id="pauseBtn" class="icon-btn" title="Pause (Esc)" aria-label="Pause"></button>
  </div>
  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast"></div>

  <script src="js/core/util.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data/shapes.js"></script>
  <script src="js/data/elements.js"></script>
  <script src="js/data/cards.js"></script>
  <script src="js/data/relics.js"></script>
  <script src="js/data/enemies.js"></script>
  <script src="js/data/sprites.js"></script>
  <script src="js/systems/board.js"></script>
  <script src="js/systems/deck.js"></script>
  <script src="js/systems/elemental.js"></script>
  <script src="js/systems/fighter.js"></script>
  <script src="js/systems/ai.js"></script>
  <script src="js/systems/battle.js"></script>
  <script src="js/systems/audio.js"></script>
  <script src="js/systems/save.js"></script>
  <script src="js/ui/pixel.js"></script>
  <script src="js/ui/input.js"></script>
  <script src="js/ui/components.js"></script>
  <script src="js/ui/arena-renderer.js"></script>
  <script src="js/proto/arena-main.js"></script>
</body>
</html>
